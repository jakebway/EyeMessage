          import Foundation
          import CoreGraphics
          import ImageIO

          let size = 1024
          let cs = CGColorSpaceCreateDeviceRGB()
          guard let ctx = CGContext(data: nil, width: size, height: size, bitsPerComponent: 8,
                                    bytesPerRow: 0, space: cs,
                                    bitmapInfo: CGImageAlphaInfo.noneSkipLast.rawValue) else {
              fatalError("could not create context")
          }

          // Green gradient background
          let top = CGColor(red: 0.38, green: 0.97, blue: 0.47, alpha: 1)
          let bottom = CGColor(red: 0.04, green: 0.74, blue: 0.16, alpha: 1)
          let grad = CGGradient(colorsSpace: cs, colors: [top, bottom] as CFArray, locations: [0, 1])!
          ctx.drawLinearGradient(grad, start: CGPoint(x: 512, y: 1024), end: CGPoint(x: 512, y: 0), options: [])

          // White speech bubble with a soft shadow
          ctx.setShadow(offset: CGSize(width: 0, height: -14), blur: 34,
                        color: CGColor(red: 0, green: 0.25, blue: 0, alpha: 0.35))
          ctx.setFillColor(CGColor(red: 1, green: 1, blue: 1, alpha: 1))
          ctx.fillEllipse(in: CGRect(x: 170, y: 330, width: 684, height: 520))

          let tail = CGMutablePath()
          tail.move(to: CGPoint(x: 250, y: 430))
          tail.addCurve(to: CGPoint(x: 170, y: 290), control1: CGPoint(x: 245, y: 350), control2: CGPoint(x: 215, y: 310))
          tail.addCurve(to: CGPoint(x: 350, y: 360), control1: CGPoint(x: 250, y: 300), control2: CGPoint(x: 310, y: 335))
          tail.closeSubpath()
          ctx.addPath(tail)
          ctx.fillPath()

          // A small gold spark: the only hint that this is no ordinary phone
          ctx.setShadow(offset: .zero, blur: 0, color: nil)
          let cx: CGFloat = 760, cy: CGFloat = 770, r: CGFloat = 78, k: CGFloat = 14
          let star = CGMutablePath()
          star.move(to: CGPoint(x: cx, y: cy + r))
          star.addQuadCurve(to: CGPoint(x: cx + r, y: cy), control: CGPoint(x: cx + k, y: cy + k))
          star.addQuadCurve(to: CGPoint(x: cx, y: cy - r), control: CGPoint(x: cx + k, y: cy - k))
          star.addQuadCurve(to: CGPoint(x: cx - r, y: cy), control: CGPoint(x: cx - k, y: cy - k))
          star.addQuadCurve(to: CGPoint(x: cx, y: cy + r), control: CGPoint(x: cx - k, y: cy + k))
          star.closeSubpath()
          ctx.setFillColor(CGColor(red: 1.0, green: 0.85, blue: 0.35, alpha: 1))
          ctx.addPath(star)
          ctx.fillPath()

          guard let image = ctx.makeImage() else { fatalError("no image") }
          let url = URL(fileURLWithPath: CommandLine.arguments[1]) as CFURL
          guard let dest = CGImageDestinationCreateWithURL(url, "public.png" as CFString, 1, nil) else {
              fatalError("no destination")
          }
          CGImageDestinationAddImage(dest, image, nil)
          if !CGImageDestinationFinalize(dest) { fatalError("could not write png") }
