          // MARK: iMessage-like transitions

          struct RiseEffect: ViewModifier {
              let p: CGFloat
              func body(content: Content) -> some View {
                  content
                      .scaleEffect(0.86 + 0.14 * p, anchor: .bottomTrailing)
                      .offset(y: (1 - p) * 52)
                      .opacity(Double(0.15 + 0.85 * p))
              }
          }

          struct PopEffect: ViewModifier {
              let p: CGFloat
              func body(content: Content) -> some View {
                  content
