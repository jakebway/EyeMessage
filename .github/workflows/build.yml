          struct GlitchingImage: View {
              let name: String
              let size: CGFloat
              @State private var glitch = false
              @State private var dx: CGFloat = 0

              var body: some View {
                  ZStack {
                      Image(name).resizable().scaledToFill()
                      if glitch {
                          Image(name).resizable().scaledToFill()
                              .colorMultiply(Color(hex: 0xFF4FD8))
                              .blendMode(.screen)
                              .offset(x: dx)
                              .opacity(0.7)
                          Image(name).resizable().scaledToFill()
                              .colorMultiply(Color(hex: 0x4FE3FF))
                              .blendMode(.screen)
                              .offset(x: -dx)
                              .opacity(0.6)
                      }
                  }
                  .frame(width: size, height: size)
                  .clipped()
                  .task {
                      // Every so often the corruption flickers, like something behind the glass.
                      while !Task.isCancelled {
                          try? await Task.sleep(nanoseconds: UInt64(Double.random(in: 4...9) * 1_000_000_000))
                          dx = CGFloat.random(in: 2...5)
                          glitch = true
                          try? await Task.sleep(nanoseconds: 90_000_000)
                          dx = -dx
                          try? await Task.sleep(nanoseconds: 70_000_000)
                          glitch = false
                      }
                  }
              }
          }

          struct IconTile: View {
              let symbol: String
