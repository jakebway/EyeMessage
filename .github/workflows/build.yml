            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Messages.app Payload/
          zip -r Messages.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Messages-ipa
          path: Messages.ipa
