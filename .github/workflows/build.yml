          import Foundation

          struct Ping {
              let to: String
              let text: String
              let delay: Double
              var sets: [String] = []
              var rename: String? = nil
          }

          struct Trigger {
              let id: String
              let when: [String]
              var any: [String] = []
              var unless: [String] = []
              let pings: [Ping]
          }

          struct Intent {
              let id: String
              var keys: [String]
              var weight: Double = 1
              var needs: [String] = []
              var blocks: [String] = []
              var all: [String] = []
              var requiresLast: String? = nil
              var replies: [String]
              var sets: [String] = []
          }

          func intent(_ id: String, _ keys: [String], _ replies: [String], w: Double = 1,
                      needs: [String] = [], blocks: [String] = [], all: [String] = [],
                      last: String? = nil, sets: [String] = []) -> Intent {
              Intent(id: id, keys: keys, weight: w, needs: needs, blocks: blocks, all: all,
                     requiresLast: last, replies: replies, sets: sets)
          }

          struct Persona {
              let key: String
              let name: String
              let emoji: String
              let c1: UInt32
              let c2: UInt32
              let intents: [Intent]
              let fallbacks: [String]
              let hint: (Set<String>) -> String?
              let endings: [String: [String]]
          }

          struct EngineResult {
              var parts: [String]
              var sets: [String]
              var intentID: String?
              var matched: Bool
              var detectedName: String?
          }

          // A small on-device dialogue model: normalises the text, scores every intent with
          // phrase / keyword / prefix / fuzzy (edit distance) matching, applies story-flag
          // gating and conversational memory, then picks a reply. No network needed.
          enum Engine {
              static let endFlags = ["end_return", "end_keep", "end_break", "end_dark"]

              static let notNames: Set<String> = Set([
                  "a", "an", "the", "not", "just", "here", "so", "very", "sorry", "really", "looking",
                  "trying", "new", "your", "sure", "back", "fine", "good", "okay", "ok", "in", "at", "on",
                  "from", "only", "still", "also", "going", "gonna", "wondering", "curious", "afraid",
                  "scared", "worried", "confused", "lost", "ready", "happy", "glad", "kind", "who", "what",
                  "how", "he", "she", "it", "ilsabet", "vesper", "pip", "corvin", "maud", "delphine",
                  "nobody", "someone", "somebody", "human", "real", "serious", "honest", "alone", "tired",
                  "stuck", "no", "yes", "bored", "nervous", "safe", "pretty", "quite", "now", "then"
              ])

              static func normalize(_ s: String) -> String {
                  let lowered = s.lowercased().replacingOccurrences(of: "&", with: " and ")
                  var out = ""
                  for ch in lowered {
                      if ch == "'" || ch == "\u{2019}" { continue }
                      if ch.isLetter || ch.isNumber { out.append(ch) } else { out.append(" ") }
                  }
                  return out.split(separator: " ").joined(separator: " ")
              }

              static func lev(_ a: String, _ b: String) -> Int {
                  let x = Array(a), y = Array(b)
                  if x.isEmpty { return y.count }
                  if y.isEmpty { return x.count }
                  var prev = Array(0...y.count)
                  for i in 1...x.count {
                      var cur = [Int](repeating: 0, count: y.count + 1)
                      cur[0] = i
                      for j in 1...y.count {
                          let cost = x[i - 1] == y[j - 1] ? 0 : 1
                          cur[j] = min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost)
                      }
                      prev = cur
                  }
                  return prev[y.count]
              }

              static func detectName(_ text: String) -> String? {
                  let words = text.split(whereSeparator: { !($0.isLetter || $0 == "'" || $0 == "\u{2019}") }).map(String.init)
                  let low = words.map { $0.lowercased().replacingOccurrences(of: "'", with: "").replacingOccurrences(of: "\u{2019}", with: "") }
                  func at(_ j: Int) -> String { j >= 0 && j < low.count ? low[j] : "" }
                  func candidate(_ j: Int, needCap: Bool) -> String? {
                      guard j < words.count else { return nil }
                      let l = low[j]
                      if notNames.contains(l) || l.count < 2 || l.count > 14 { return nil }
                      if needCap && !(words[j].first?.isUppercase ?? false) { return nil }
                      return words[j].prefix(1).uppercased() + words[j].dropFirst().lowercased()
                  }
                  for i in 0..<low.count {
                      if at(i) == "my" && at(i + 1) == "name" && at(i + 2) == "is", let n = candidate(i + 3, needCap: false) { return n }
                      if at(i) == "name" && at(i + 1) == "is", let n = candidate(i + 2, needCap: false) { return n }
                      if at(i) == "call" && at(i + 1) == "me", let n = candidate(i + 2, needCap: false) { return n }
                      if at(i) == "im", let n = candidate(i + 1, needCap: true) { return n }
                      if at(i) == "i" && at(i + 1) == "am", let n = candidate(i + 2, needCap: true) { return n }
                  }
                  return nil
              }

              static func matchScore(_ key: String, _ tokens: [String], _ padded: String) -> Double {
                  if key.contains(" ") { return padded.contains(" \(key) ") ? 2.5 : 0 }
                  if tokens.contains(key) { return 1 }
                  if key.count >= 4, tokens.contains(where: { $0.hasPrefix(key) && $0.count - key.count <= 3 }) { return 0.8 }
                  if key.count >= 5, tokens.contains(where: { abs($0.count - key.count) <= 1 && lev($0, key) <= 1 }) { return 0.7 }
                  return 0
              }

              static func makeParts(_ raw: String, name: String, hint: String?) -> [String] {
                  var t = raw.replacingOccurrences(of: "{name}", with: name)
                  t = t.replacingOccurrences(of: "{hint}", with: hint ?? "keep talking to me")
                  return t.components(separatedBy: "||")
                      .map { $0.trimmingCharacters(in: .whitespaces) }
                      .filter { !$0.isEmpty }
              }

              static func respond(persona: Persona, text: String, counts: [String: Int], lastIntent: String?,
                                  confused: Int, flags: Set<String>, finderName: String?) -> EngineResult {
                  let detected = detectName(text)
                  let name = detected ?? finderName ?? "stranger"
                  var norm = normalize(text)
                  if text.contains("\u{1F319}") { norm += " moon" }
                  var tokens = norm.split(separator: " ").map(String.init)
                  if detected != nil {
                      tokens.append("__name__")
                      norm += " __name__"
                  }
                  let padded = " " + norm + " "
                  let hint = persona.hint(flags)

                  // After the story ends, everyone answers from their epilogue lines.
                  if let end = endFlags.first(where: { flags.contains($0) }),
                     let lines = persona.endings[end], !lines.isEmpty {
                      let n = counts["epilogue"] ?? 0
                      return EngineResult(parts: makeParts(lines[n % lines.count], name: name, hint: hint),
                                          sets: [], intentID: "epilogue", matched: true, detectedName: detected)
                  }

                  var best: Intent? = nil
                  var bestScore = 0.0
                  for it in persona.intents {
                      if !it.needs.allSatisfy({ flags.contains($0) }) { continue }
                      if it.blocks.contains(where: { flags.contains($0) }) { continue }
                      if let l = it.requiresLast, l != lastIntent { continue }
                      if !it.all.allSatisfy({ padded.contains(" \($0) ") }) { continue }
                      var s = 0.0
                      for k in it.keys { s += matchScore(k, tokens, padded) }
                      s *= it.weight
                      if s > bestScore { bestScore = s; best = it }
                  }

                  if let it = best, bestScore >= 0.75 {
                      let n = counts[it.id] ?? 0
                      let idx: Int
                      if n < it.replies.count { idx = n }
                      else if it.replies.count > 1 { idx = Int.random(in: 1..<it.replies.count) }
                      else { idx = 0 }
                      return EngineResult(parts: makeParts(it.replies[idx], name: name, hint: hint),
                                          sets: it.sets, intentID: it.id, matched: true, detectedName: detected)
                  }

                  var parts = [persona.fallbacks[confused % persona.fallbacks.count]]
                  if confused >= 1, let h = hint { parts.append(h) }
                  return EngineResult(parts: parts, sets: [], intentID: nil, matched: false, detectedName: detected)
              }
          }
