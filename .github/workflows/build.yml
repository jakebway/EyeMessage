          // MARK: chat

          struct RowModel: Identifiable {
              let id: UUID
              let msg: ChatMessage
              let header: String?
              let tight: Bool
              let tail: Bool
              let last: Bool
          }

          struct ChatView: View {
              @EnvironmentObject var store: ChatStore
              @Environment(\.dismiss) private var dismiss
              let id: UUID
              @State private var draft = ""
              @FocusState private var focused: Bool

              var convo: Conversation? { store.conversations.first { $0.id == id } }

              func rows(for c: Conversation) -> [RowModel] {
                  var out: [RowModel] = []
                  let msgs = c.messages
                  for (i, msg) in msgs.enumerated() {
                      let prev: ChatMessage? = i > 0 ? msgs[i - 1] : nil
                      let next: ChatMessage? = i < msgs.count - 1 ? msgs[i + 1] : nil
                      var header: String? = nil
                      if let p = prev {
                          if msg.date.timeIntervalSince(p.date) > 3600 { header = msg.date.headerLabel() }
                      } else {
                          header = msg.date.headerLabel()
                      }
                      var nextHeader = false
                      if let n = next { nextHeader = n.date.timeIntervalSince(msg.date) > 3600 }
                      let tail = next == nil || next!.isMe != msg.isMe || nextHeader
                      let tight = prev != nil && prev!.isMe == msg.isMe && header == nil
                      out.append(RowModel(id: msg.id, msg: msg, header: header, tight: tight, tail: tail, last: i == msgs.count - 1))
                  }
                  return out
              }

              func scrollDown(_ proxy: ScrollViewProxy) {
                  DispatchQueue.main.async {
                      withAnimation(.easeOut(duration: 0.25)) {
                          proxy.scrollTo("bottom", anchor: .bottom)
                      }
                  }
              }

              func send() {
                  let t = draft.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !t.isEmpty else { return }
                  draft = ""
                  store.send(t, to: id)
              }

              func header(_ c: Conversation) -> some View {
                  ZStack {
                      VStack(spacing: 3) {
                          Avatar(convo: c, size: 44)
                          HStack(spacing: 3) {
                              Text(c.name).font(.system(size: 12, weight: .medium))
                              Image(systemName: "chevron.right")
                                  .font(.system(size: 8, weight: .bold))
                                  .foregroundStyle(.secondary)
                          }
                      }
                      HStack {
                          Button { dismiss() } label: { GlassIcon(name: "chevron.left") }
                          Spacer()
                          GlassIcon(name: "video")
                      }
                  }
                  .padding(.horizontal, 14)
                  .padding(.top, 4)
                  .padding(.bottom, 8)
                  .background(.ultraThinMaterial, ignoresSafeAreaEdges: .top)
              }

              var inputBar: some View {
                  HStack(alignment: .bottom, spacing: 8) {
                      GlassIcon(name: "plus")
                      HStack(alignment: .bottom, spacing: 6) {
                          TextField("iMessage", text: $draft, axis: .vertical)
                              .lineLimit(1...5)
                              .focused($focused)
                              .padding(.vertical, 9)
                              .padding(.leading, 14)
                          if draft.isEmpty {
                              Image(systemName: "mic.fill")
                                  .foregroundStyle(.secondary)
                                  .padding(.trailing, 14)
                                  .padding(.bottom, 11)
                          } else {
                              Button(action: send) {
                                  Image(systemName: "arrow.up.circle.fill")
                                      .font(.system(size: 30))
                                      .foregroundStyle(imBlue)
                              }
                              .padding(.trailing, 5)
                              .padding(.bottom, 4)
                          }
                      }
                      .background(.ultraThinMaterial, in: RoundedRectangle(cornerRadius: 22, style: .continuous))
                      .overlay(
                          RoundedRectangle(cornerRadius: 22, style: .continuous)
                              .stroke(Color.primary.opacity(0.1), lineWidth: 0.5)
                      )
                  }
                  .padding(.horizontal, 12)
                  .padding(.vertical, 6)
              }

              func content(_ c: Conversation) -> some View {
                  ScrollViewReader { proxy in
                      ScrollView {
                          LazyVStack(spacing: 2) {
                              Color.clear.frame(height: 6)
                              ForEach(rows(for: c)) { row in
                                  MessageRow(row: row, status: status(for: c, row: row))
                              }
                              if store.typing.contains(id) {
                                  TypingBubble()
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .padding(.top, 6)
                              }
                              Color.clear.frame(height: 1).id("bottom")
                          }
                          .padding(.horizontal, 12)
                      }
                      .scrollDismissesKeyboard(.interactively)
                      .onAppear {
                          store.openChat = id
                          store.markRead(id)
                          scrollDown(proxy)
                      }
                      .onDisappear {
                          if store.openChat == id { store.openChat = nil }
                      }
                      .onChange(of: c.messages.count) { _ in
                          store.markRead(id)
                          scrollDown(proxy)
                      }
                      .onChange(of: store.typing) { _ in scrollDown(proxy) }
                      .onChange(of: focused) { _ in scrollDown(proxy) }
                  }
                  .background(Color(.systemBackground))
                  .safeAreaInset(edge: .top, spacing: 0) { header(c) }
                  .safeAreaInset(edge: .bottom, spacing: 0) { inputBar }
              }

              func status(for c: Conversation, row: RowModel) -> String? {
                  guard row.last && row.msg.isMe else { return nil }
                  return store.typing.contains(id) ? "Read" : "Delivered"
              }

              var body: some View {
                  Group {
                      if let c = convo {
                          content(c)
                      } else {
                          Color(.systemBackground)
                      }
                  }
                  .navigationBarBackButtonHidden(true)
                  .toolbar(.hidden, for: .navigationBar)
              }
          }

          struct MessageRow: View {
              let row: RowModel
              let status: String?

              var body: some View {
                  let msg = row.msg
                  VStack(alignment: msg.isMe ? .trailing : .leading, spacing: 2) {
                      if let h = row.header {
                          Text(h)
                              .font(.caption2)
                              .foregroundStyle(.secondary)
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 10)
                      }
                      HStack {
                          if msg.isMe { Spacer(minLength: 52) }
                          Text(msg.text)
                              .font(.system(size: 17))
                              .foregroundStyle(msg.isMe ? Color.white : Color.primary)
                              .fixedSize(horizontal: false, vertical: true)
                              .padding(.leading, msg.isMe ? 12 : 17)
                              .padding(.trailing, msg.isMe ? 17 : 12)
                              .padding(.vertical, 8)
                              .background(
                                  BubbleShape(isMe: msg.isMe, tail: row.tail)
                                      .fill(msg.isMe ? imBlue : Color(.systemGray5))
                              )
                          if !msg.isMe { Spacer(minLength: 52) }
                      }
                      .padding(.top, row.tight ? 0 : 5)
                      if let s = status {
                          Text(s)
                              .font(.caption2)
                              .fontWeight(.medium)
                              .foregroundStyle(.secondary)
                              .padding(.trailing, 4)
                              .padding(.top, 1)
                      }
                  }
                  .frame(maxWidth: .infinity, alignment: msg.isMe ? .trailing : .leading)
              }
          }
