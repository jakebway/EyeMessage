              func minutesToDawn(_ now: Date) -> Int {
                  let cal = Calendar.current
                  var dawn = cal.date(bySettingHour: 6, minute: 14, second: 0, of: now) ?? now
                  if dawn <= now { dawn = cal.date(byAdding: .day, value: 1, to: dawn) ?? dawn }
                  return Int(dawn.timeIntervalSince(now) / 60)
              }

              func showHint() {
                  withAnimation(.easeInOut(duration: 0.25)) { hint = true }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 2.2) {
                      withAnimation(.easeInOut(duration: 0.25)) { hint = false }
                  }
              }

              // The big iOS 26/27 Lock Screen clock: tall, thin, condensed numerals with a glassy rim.
              func clock(_ date: Date) -> some View {
                  let digits = date.fmt("h:mm")
                  let face = Text(digits)
                      .font(.system(size: 250, weight: .ultraLight))
                      .fontWidth(.compressed)
                  return face
                      .foregroundStyle(LinearGradient(colors: [Color.white.opacity(0.62), Color.white.opacity(0.38)],
                                                      startPoint: .top, endPoint: .bottom))
                      .overlay(
                          face
                              .foregroundStyle(LinearGradient(colors: [Color.white.opacity(0.9), Color.white.opacity(0)],
                                                              startPoint: .top, endPoint: .center))
                              .offset(x: -0.6, y: -1.2)
                              .mask(face)
                      )
                      .shadow(color: .black.opacity(0.55), radius: 1.5, x: 0.8, y: 1.6)
                      .lineLimit(1)
                      .minimumScaleFactor(0.4)
                      .frame(maxWidth: 330, maxHeight: 210)
              }

