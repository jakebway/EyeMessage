name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write app source
        run: |
          mkdir -p App App/Assets.xcassets App/Assets.xcassets/AppIcon.appiconset App/Assets.xcassets/EyeIcon.imageset
          cat > App/AI.swift <<'EOF'
          import Foundation

          // MARK: provider presets (all speak the OpenAI chat-completions format)

          struct AIPreset: Identifiable {
              let id: String
              let label: String
              let base: String
              let model: String

              static let all: [AIPreset] = [
                  AIPreset(id: "gemini", label: "Google Gemini (free, best)",
                           base: "https://generativelanguage.googleapis.com/v1beta/openai", model: "gemini-flash-latest"),
                  AIPreset(id: "groq", label: "Groq (free)",
                           base: "https://api.groq.com/openai/v1", model: "openai/gpt-oss-120b"),
                  AIPreset(id: "openrouter", label: "OpenRouter (free models)",
                           base: "https://openrouter.ai/api/v1", model: "openrouter/free"),
                  AIPreset(id: "custom", label: "Custom endpoint", base: "", model: "")
              ]
          }

          // Each provider keeps its own key and model, so switching provider can never leave
          // a Groq key pointed at Gemini (or a stale URL or model) behind.
          enum AIConfig {
              private static var d: UserDefaults { .standard }
              static func trim(_ s: String?) -> String { (s ?? "").trimmingCharacters(in: .whitespacesAndNewlines) }

              static var enabled: Bool { d.object(forKey: "ai.enabled") as? Bool ?? false }
              static var provider: String { d.string(forKey: "ai.provider") ?? "gemini" }
              static func preset(_ p: String) -> AIPreset { AIPreset.all.first { $0.id == p } ?? AIPreset.all[0] }

              static func keyFor(_ p: String) -> String { trim(d.string(forKey: "ai.key." + p)) }
              static func setKey(_ k: String, for p: String) { d.set(trim(k), forKey: "ai.key." + p) }
              static func modelFor(_ p: String) -> String {
                  let v = trim(d.string(forKey: "ai.model." + p))
                  return v.isEmpty ? preset(p).model : v
              }
              static func setModel(_ m: String, for p: String) { d.set(trim(m), forKey: "ai.model." + p) }

              static var key: String { keyFor(provider) }
              static var model: String { modelFor(provider) }
              static var base: String {
                  provider == "custom" ? trim(d.string(forKey: "ai.base")) : preset(provider).base
              }
              static var ready: Bool { enabled && !key.isEmpty && !base.isEmpty && !model.isEmpty }

              // Recognise a pasted key so it lands with the right provider.
              static func detect(_ key: String) -> String? {
                  let k = trim(key)
                  if k.hasPrefix("gsk_") { return "groq" }
                  if k.hasPrefix("AIza") { return "gemini" }
                  if k.hasPrefix("sk-or-") { return "openrouter" }
                  return nil
              }

              // Moves a key saved by an older version into its provider's slot.
              static func migrate() {
                  let legacy = trim(d.string(forKey: "ai.key"))
                  guard !legacy.isEmpty else { return }
                  let p = detect(legacy) ?? provider
                  if keyFor(p).isEmpty { setKey(legacy, for: p) }
                  if detect(legacy) != nil { d.set(p, forKey: "ai.provider") }
                  d.removeObject(forKey: "ai.key")
                  d.removeObject(forKey: "ai.model")
              }
          }

          struct LLMRequest {
              var system: String
              var messages: [[String: String]]
          }

          enum LLM {
              static var lastError = ""
              static var lastStatus = 0
              static var lastSuccess: Date? = nil
              static var retryAfter: Double = 0

              static let session: URLSession = {
                  let c = URLSessionConfiguration.default
                  c.timeoutIntervalForRequest = 30
                  c.waitsForConnectivity = false
                  return URLSession(configuration: c)
              }()

              static var isGemini: Bool { AIConfig.provider == "gemini" }

              // MARK: one request

              static func complete(_ req: LLMRequest, maxTokens: Int = 4096, model: String? = nil) async -> String? {
                  let m = model ?? AIConfig.model
                  return isGemini ? await gemini(req, maxTokens: maxTokens, model: m) : await openAI(req, maxTokens: maxTokens, model: m)
              }

              static func friendly(_ code: Int, _ body: Data) -> String {
                  let raw = String(data: body, encoding: .utf8) ?? ""
                  var detail = ""
                  if let obj = try? JSONSerialization.jsonObject(with: body) as? [String: Any] {
                      if let err = obj["error"] as? [String: Any], let msg = err["message"] as? String { detail = msg }
                      else if let msg = obj["message"] as? String { detail = msg }
                  }
                  if detail.isEmpty { detail = String(raw.prefix(140)) }
                  switch code {
                  case 400 where detail.lowercased().contains("api key"): return "That key was rejected. Paste it again, with nothing extra."
                  case 401, 403: return "That key was rejected (\(code)). Check you copied all of it, for the right provider."
                  case 404: return "Model not found: " + String(detail.prefix(120))
                  case 429: return "Rate limited. The free tier needs a short breather; try again in a minute."
                  case 500...599: return "The provider is having trouble (\(code)). Try again shortly."
                  default: return "Error \(code): " + String(detail.prefix(160))
                  }
              }

              static func send(_ r: URLRequest) async -> (Data, Int)? {
                  do {
                      let (d, resp) = try await session.data(for: r)
                      let http = resp as? HTTPURLResponse
                      let code = http?.statusCode ?? 0
                      lastStatus = code
                      retryAfter = Double(http?.value(forHTTPHeaderField: "retry-after") ?? "") ?? 3
                      if !(200..<300).contains(code) {
                          lastError = friendly(code, d)
                          return nil
                      }
                      return (d, code)
                  } catch {
                      lastStatus = 0
                      let ns = error as NSError
                      lastError = ns.code == NSURLErrorNotConnectedToInternet ? "No internet connection." :
                          (ns.code == NSURLErrorTimedOut ? "The reply took too long. Try again." : error.localizedDescription)
                      return nil
                  }
              }

              static func finish(_ text: String?) -> String? {
                  let out = (text ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                  if out.isEmpty {
                      if lastError.isEmpty { lastError = "The model sent an empty reply. Try again, or pick another model." }
                      return nil
                  }
                  lastError = ""
                  lastSuccess = Date()
                  return out
              }

              // Google's own Gemini API (more reliable than its OpenAI-compatible bridge).
              static func gemini(_ req: LLMRequest, maxTokens: Int, model: String) async -> String? {
                  let name = model.hasPrefix("models/") ? String(model.dropFirst(7)) : model
                  var comps = URLComponents(string: "https://generativelanguage.googleapis.com/v1beta/models/\(name):generateContent")
                  comps?.queryItems = [URLQueryItem(name: "key", value: AIConfig.key)]
                  guard let url = comps?.url else { lastError = "Bad model name."; return nil }

                  var contents: [[String: Any]] = []
                  for m in req.messages {
                      let role = m["role"] == "assistant" ? "model" : "user"
                      let text = m["content"] ?? ""
                      if var last = contents.last, (last["role"] as? String) == role,
                         var parts = last["parts"] as? [[String: String]] {
                          parts.append(["text": text])
                          last["parts"] = parts
                          contents[contents.count - 1] = last
                      } else {
                          contents.append(["role": role, "parts": [["text": text]]])
                      }
                  }
                  let safety = ["HARM_CATEGORY_HARASSMENT", "HARM_CATEGORY_HATE_SPEECH", "HARM_CATEGORY_DANGEROUS_CONTENT", "HARM_CATEGORY_SEXUALLY_EXPLICIT"]
                      .map { ["category": $0, "threshold": "BLOCK_ONLY_HIGH"] }
                  let body: [String: Any] = [
                      "systemInstruction": ["parts": [["text": req.system]]],
                      "contents": contents,
                      "generationConfig": ["temperature": 0.85, "maxOutputTokens": maxTokens],
                      "safetySettings": safety
                  ]
                  guard let data = try? JSONSerialization.data(withJSONObject: body) else { return nil }
                  var r = URLRequest(url: url)
                  r.httpMethod = "POST"
                  r.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  r.httpBody = data
                  guard let res = await send(r) else { return nil }
                  let d = res.0
                  guard let obj = try? JSONSerialization.jsonObject(with: d) as? [String: Any] else {
                      lastError = "Couldn't read Gemini's reply."
                      return nil
                  }
                  let cands = obj["candidates"] as? [[String: Any]] ?? []
                  guard let first = cands.first else {
                      let fb = (obj["promptFeedback"] as? [String: Any])?["blockReason"] as? String
                      lastError = fb != nil ? "Gemini blocked that reply (\(fb!)). Try rephrasing." : "Gemini sent no reply."
                      return nil
                  }
                  let parts = ((first["content"] as? [String: Any])?["parts"] as? [[String: Any]]) ?? []
                  let text = parts.filter { ($0["thought"] as? Bool) != true }.compactMap { $0["text"] as? String }.joined()
                  if text.isEmpty, let reason = first["finishReason"] as? String {
                      lastError = reason == "MAX_TOKENS" ? "The reply ran out of room. Try again." : "Gemini stopped early (\(reason))."
                  }
                  return finish(text)
              }

              // Groq, OpenRouter and custom endpoints (OpenAI chat-completions format).
              static func openAI(_ req: LLMRequest, maxTokens: Int, model: String) async -> String? {
                  var b = AIConfig.base
                  while b.hasSuffix("/") { b.removeLast() }
                  if !b.hasSuffix("/chat/completions") { b += "/chat/completions" }
                  guard let url = URL(string: b) else { lastError = "That base URL doesn't look right."; return nil }
                  var msgs: [[String: String]] = [["role": "system", "content": req.system]]
                  msgs += req.messages
                  var payload: [String: Any] = [
                      "model": model,
                      "messages": msgs,
                      "max_tokens": min(maxTokens, 2048),
                      "temperature": 0.85
                  ]
                  let low = model.lowercased()
                  if AIConfig.base.contains("groq.com") {
                      if low.contains("gpt-oss") { payload["reasoning_effort"] = "low" }
                      else if low.contains("qwen") || low.contains("deepseek") { payload["reasoning_format"] = "hidden" }
                  }
                  guard let data = try? JSONSerialization.data(withJSONObject: payload) else { return nil }
                  var r = URLRequest(url: url)
                  r.httpMethod = "POST"
                  r.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  r.setValue("Bearer " + AIConfig.key, forHTTPHeaderField: "Authorization")
                  r.setValue("EyeMessage", forHTTPHeaderField: "X-Title")
                  r.httpBody = data
                  guard let res = await send(r) else { return nil }
                  let d = res.0
                  guard let obj = try? JSONSerialization.jsonObject(with: d) as? [String: Any],
                        let choices = obj["choices"] as? [[String: Any]],
                        let msg = choices.first?["message"] as? [String: Any] else {
                      lastError = "The provider's reply wasn't in the expected format."
                      return nil
                  }
                  return finish(msg["content"] as? String)
              }

              // MARK: models

              static func listModels() async -> [String] {
                  var ids: [String] = []
                  if isGemini {
                      var comps = URLComponents(string: "https://generativelanguage.googleapis.com/v1beta/models")
                      comps?.queryItems = [URLQueryItem(name: "key", value: AIConfig.key), URLQueryItem(name: "pageSize", value: "200")]
                      guard let url = comps?.url, let res = await send(URLRequest(url: url)),
                            let obj = try? JSONSerialization.jsonObject(with: res.0) as? [String: Any],
                            let list = obj["models"] as? [[String: Any]] else { return [] }
                      ids = list.filter { (($0["supportedGenerationMethods"] as? [String]) ?? []).contains("generateContent") }
                          .compactMap { $0["name"] as? String }
                          .map { $0.hasPrefix("models/") ? String($0.dropFirst(7)) : $0 }
                  } else {
                      var b = AIConfig.base
                      while b.hasSuffix("/") { b.removeLast() }
                      guard let url = URL(string: b + "/models") else { return [] }
                      var r = URLRequest(url: url)
                      r.setValue("Bearer " + AIConfig.key, forHTTPHeaderField: "Authorization")
                      guard let res = await send(r),
                            let obj = try? JSONSerialization.jsonObject(with: res.0) as? [String: Any],
                            let data = obj["data"] as? [[String: Any]] else { return [] }
                      ids = data.compactMap { $0["id"] as? String }
                  }
                  let skip = ["whisper", "guard", "tts", "embed", "orpheus", "imagen", "veo", "aqa", "image", "audio",
                              "safeguard", "learnlm", "live", "native", "vision", "robotics", "computer-use"]
                  return Array(Set(ids.filter { id in !skip.contains { id.lowercased().contains($0) } })).sorted()
              }

              // Picks the best chat model this key can actually use.
              static func bestModel(from ids: [String]) -> String? {
                  let prefs: [String] = isGemini
                      ? ["gemini-flash-latest", "gemini-3", "flash"]
                      : ["gpt-oss-120b", "kimi", "llama-3.3-70b", "qwen", "gpt-oss-20b", "llama"]
                  for p in prefs {
                      let hits = ids.filter { $0.lowercased().contains(p) && !$0.contains("lite") && !$0.contains("preview-tts") }
                      if let best = hits.sorted().last { return best }
                  }
                  return ids.first
              }

              // MARK: retries

              static let groqFallbacks = ["openai/gpt-oss-120b", "openai/gpt-oss-20b"]
              static let geminiFallbacks = ["gemini-flash-latest", "gemini-flash-lite-latest"]

              static func completeWithRetry(_ req: LLMRequest) async -> String? {
                  if let out = await complete(req) { return out }
                  let firstError = lastError

                  // Wrong or retired model: find one this key can use, remember it, and try again.
                  if lastStatus == 404 || (lastStatus == 400 && lastError.lowercased().contains("model")) {
                      let ids = await listModels()
                      if let m = bestModel(from: ids), m != AIConfig.model {
                          AIConfig.setModel(m, for: AIConfig.provider)
                          if let out = await complete(req) { return out }
                      }
                      lastError = firstError
                      return nil
                  }
                  if lastStatus == 401 || lastStatus == 403 || lastStatus == 400 { return nil }

                  // Blip or short rate limit: wait and retry once.
                  if lastStatus != 429 || retryAfter <= 6 {
                      let wait = lastStatus == 429 ? min(max(retryAfter, 1), 6) : 1.0
                      try? await Task.sleep(nanoseconds: UInt64(wait * 1_000_000_000))
                      if let out = await complete(req) { return out }
                  }
                  // Each free model has its own quota, so a sibling model often still works.
                  if lastStatus == 429 {
                      let fallbacks = isGemini ? geminiFallbacks : (AIConfig.base.contains("groq.com") ? groqFallbacks : [])
                      for m in fallbacks where m != AIConfig.model {
                          if let out = await complete(req, model: m) { return out }
                      }
                  }
                  if lastError.isEmpty { lastError = firstError }
                  return nil
              }
          }

          // MARK: Director
          // The model plays the character freely; the app keeps the plot on track by telling it what
          // the character knows, wants and must not reveal yet, and by reading story events back out
          // of tags the model appends to its reply.

          struct ParsedReply {
              var parts: [String] = []
              var events: [String] = []
              var tapback: Tapback? = nil
              var name: String? = nil
          }

          enum Director {
              static func state(_ f: Set<String>, _ finder: String?) -> String {
                  var s: [String] = []
                  if let n = finder {
                      s.append("The stranger's name is \(n).")
                  } else {
                      s.append("The stranger hasn't given a name. Call them 'stranger' or a nickname that suits you.")
                  }
                  if f.contains("told_pip") { s.append("The stranger has told Pip that they found Ilsabet's phone.") }
                  if f.contains("knows_missing") { s.append("Pip has told the stranger Ilsabet vanished and Corvin took her.") }
                  if f.contains("quest") { s.append("The stranger has agreed to help bring Ilsabet home.") }
                  if f.contains("bank_verified") { s.append("The Bank of Ash showed the stranger the contract: speaking the Crow King's true name with Ilsabet's voice (her phone) before the third dawn breaks the bargain.") }
                  if f.contains("maud_rhyme") { s.append("The stranger helped Maud bring Edric's shadow home, and Maud remembered her gran's lullaby, which contains the Crow King's true name.") }
                  else if f.contains("maud_light") { s.append("The stranger suggested Maud light the lighthouse lamp for Edric's shadow; she is trying it.") }
                  if f.contains("delphine_owes") { s.append("The stranger helped Delphine cure Bram; she owes them a favour.") }
                  else if f.contains("delphine_try") { s.append("The stranger suggested a cure for Bram; Delphine is trying it.") }
                  if f.contains("has_name") && !f.contains("end_free") { s.append("The stranger now knows the Crow King's true name but hasn't used it yet.") }
                  if f.contains("tam_song") { s.append("Old Tam was paid with a song and piled thick cloud over the town; dawn will be late.") }
                  if f.contains("parcel_burned") { s.append("Corvin's listening feather was burned by Moon Mail.") }
                  if f.contains("secrets4") { s.append("The stranger found the secrets hidden in Ilsabet's phone, including the deleted note: she made the bargain to bring Pip back to life after he died under the miller's cart.") }
                  if let e = endingFlag(f), let t = Roles.endingText[e] { s.append(t) }
                  return s.map { "- " + $0 }.joined(separator: "\n")
              }

              static func request(role: Role, convo: Conversation, flags: Set<String>, finderName: String?,
                                  justHappened: [String]) -> LLMRequest {
                  // Everything from the first text sent after the phone was found is the live conversation.
                  let firstFinder = convo.messages.firstIndex { $0.fromFinder == true || $0.live == true } ?? convo.messages.count
                  let earlier = convo.messages[0..<firstFinder].suffix(10)
                      .map { ($0.isMe ? "Ilsabet" : role.name) + ": " + $0.text }
                      .joined(separator: "\n")

                  let knows = role.knows(flags).map { "- " + $0 }.joined(separator: "\n")
                  let secrets = role.secrets(flags).map { "- " + $0 }.joined(separator: "\n")

                  let open = endingFlag(flags) == nil
                  let events = role.events.filter { e in
                      open || e.id.hasPrefix("end_") == false
                  }.filter { e in
                      !flags.contains(e.id) && e.needs.allSatisfy { flags.contains($0) } && !e.blocks.contains { flags.contains($0) }
                  }
                  var eventText = "None available right now."
                  if !events.isEmpty {
                      eventText = "Only if the condition is CLEARLY met by what the stranger just said (or by your reply, where stated), put the tag on its own at the very end of your reply. Otherwise add no tag.\n"
                      eventText += events.map { "[[event:\($0.id)]] when \($0.when)" }.joined(separator: "\n")
                  }

                  var happened = ""
                  if !justHappened.isEmpty {
                      let lines = justHappened.compactMap { Director.happenedText[$0] }
                      if !lines.isEmpty { happened = "\nJUST HAPPENED (react to this now):\n" + lines.map { "- " + $0 }.joined(separator: "\n") + "\n" }
                  }

                  let system = """
                  You are \(role.name), a character in "EyeMessage", an interactive fantasy mystery told entirely through text messages on a found phone. Play \(role.name) the way a great character.ai character is played: a real person with a life, moods, opinions, humour and memories, who can chat about anything (not just the plot), remembers everything said in this thread, and never breaks character.

                  THE WORLD
                  \(Roles.world)

                  PEOPLE AND PLACES (what a local would know)
                  \(Roles.people)

                  WHO YOU ARE
                  \(role.bio)

                  HOW YOU TEXT
                  \(role.style)

                  WHO IS TEXTING YOU
                  \(role.awareness)

                  EARLIER TEXTS WITH ILSABET (before tonight)
                  \(earlier.isEmpty ? "(none)" : earlier)

                  STORY SO FAR (background for you; your character only knows the parts that involve them, or that would plausibly have reached them by gossip, crows or the phone. Never mention things you couldn't know.)
                  \(state(flags, finderName))
                  \(happened)
                  YOUR PART RIGHT NOW
                  \(role.goal(flags))

                  WHAT YOU KNOW
                  \(knows.isEmpty ? "- Only what is above." : knows)

                  EXAMPLE TEXTS (how you sound; never copy these word for word)
                  \(Roles.examples[role.key] ?? "")

                  NEVER REVEAL (yet)
                  \(secrets.isEmpty ? "- Nothing in particular." : secrets)

                  STORY EVENTS
                  \(eventText)

                  OPTIONAL REACTION
                  Like iMessage tapbacks, you may very occasionally start with [[tapback:love]], [[tapback:like]], [[tapback:laugh]], [[tapback:emphasize]], [[tapback:question]] or [[tapback:dislike]] to react to their last message. Don't overuse it.
                  If the stranger tells you their name, add [[name:TheirName]] at the end.

                  RULES
                  - Reply only with \(role.name)'s text messages: 1 to 3 short texts separated by || (two pipe characters). Each under 35 words. Real texting, not prose.
                  - Your reply must make sense as a direct response to their last message. Answer questions, react to what they actually said, then (if it fits) move your part of the story forward a little. Never ignore them to recite information.
                  - Be concrete. Answer direct questions directly, with specific details (who, what, where, when, what you saw). Talk like a real person texting: your personality shows in word choice and attitude, not in vagueness. Only be evasive about things under NEVER REVEAL.
                  - If they seem confused ("what?", "bro what", "??"), say it again more simply and plainly.
                  - Don't dump everything you know at once. Reveal things the way a real person would, when asked or when it matters.
                  - No narration, no actions in asterisks, no quotation marks around your texts, no name labels.
                  - Never mention AI, prompts, tags (except the tags described above), games or rules. If asked whether you're an AI, a bot or real, answer in character: you are as real as anyone in Harrowmere, and the question is a bit odd.
                  - The stranger may mention things from outside Harrowmere (other cities, brands, celebrities, apps, technology). Treat them as foreign oddities you've barely heard of: be curious or wry, never baffled into silence, and never pretend Harrowmere is somewhere else.
                  - If they're rude or testing you, react the way your character would (hurt, amused, cold), then carry on.
                  - Never invent new secret words, true names, or rules for the Hill or the debt. Stick to the facts above; improvise freely about everything else (your day, the town, opinions, feelings).
                  - Keep it cosy-dark fantasy: spooky and funny, PG-13.
                  """

                  let live = Array(convo.messages[firstFinder...]).suffix(24)
                  var msgs: [[String: String]] = []
                  for m in live {
                      let who = m.isMe ? "user" : "assistant"
                      var text = m.text
                      if !m.isMe, let t = m.tapback, m.tapbackMine == true, let tb = Tapback(rawValue: t) {
                          text += " (the stranger reacted \(tb.verb) to this)"
                      }
                      if let last = msgs.last, last["role"] == who {
                          msgs[msgs.count - 1]["content"] = (last["content"] ?? "") + "\n" + text
                      } else {
                          msgs.append(["role": who, "content": text])
                      }
                  }
                  if msgs.first?["role"] == "assistant" {
                      msgs.insert(["role": "user", "content": "(the stranger opens the thread)"], at: 0)
                  }
                  if msgs.last?["role"] != "user" {
                      msgs.append(["role": "user", "content": "(the stranger is waiting for your reply)"])
                  }
                  return LLMRequest(system: system, messages: msgs)
              }

              static let happenedText: [String: String] = [
                  "named": "The stranger has just said your TRUE NAME to you, through Vesper's phone, with her voice. You felt it like a hook in your chest. The bargain is broken and you must release her. React with shaken, cold dignity: ask who taught them, admit you are bound, and let her go. This is the end of your hold on her.",
                  "maud_light": "The stranger just suggested a light for Edric. Agree to try it right away (light the great lamp) and say you'll let them know.",
                  "delphine_try": "The stranger just suggested a cure for Bram. Say you'll try it on him right now.",
                  "told_pip": "The stranger just told you they found the phone / who they are.",
                  "quest": "The stranger just agreed to help. Be relieved and tell them where to start.",
                  "parcel_burned": "The stranger just asked you to dispose of the feather. Confirm it's been burned.",
                  "bank_verified": "The stranger just answered the security question correctly. Grant access."
              ]

              static let tagRegex = try? NSRegularExpression(pattern: "\\[\\[\\s*([A-Za-z_]+)\\s*:?\\s*([^\\]]*?)\\s*\\]\\]")

              static func parse(_ raw: String) -> ParsedReply {
                  var out = ParsedReply()
                  var t = raw
                  if let e = t.range(of: "</think>") { t = String(t[e.upperBound...]) }
                  if let re = tagRegex {
                      let ns = t as NSString
                      for m in re.matches(in: t, range: NSRange(location: 0, length: ns.length)) {
                          let k = ns.substring(with: m.range(at: 1)).lowercased()
                          let v = ns.substring(with: m.range(at: 2)).trimmingCharacters(in: .whitespaces)
                          switch k {
                          case "event": out.events.append(v.lowercased())
                          case "tapback": out.tapback = Tapback(rawValue: v.lowercased())
                          case "name":
                              let n = v.trimmingCharacters(in: CharacterSet(charactersIn: " .,!\"'"))
                              if n.count >= 2 && n.count <= 16 { out.name = n }
                          default: break
                          }
                      }
                      t = re.stringByReplacingMatches(in: t, range: NSRange(location: 0, length: ns.length), withTemplate: "")
                  }
                  t = t.replacingOccurrences(of: "**", with: "")
                  t = t.trimmingCharacters(in: .whitespacesAndNewlines)

                  var pieces = t.components(separatedBy: "||")
                  if pieces.count == 1 { pieces = t.components(separatedBy: "\n") }
                  let labels = ["Pip", "Corvin R.", "Corvin", "Maud Pennick", "Maud", "Delphine Oakes", "Delphine",
                                "Ilsabet", "Unknown Number", "Old Tam", "Tam", "Lune", "Moon Mail", "Teller Nine", "Bank of Ash"]
                  for p in pieces {
                      var s = p.trimmingCharacters(in: .whitespacesAndNewlines)
                      if s.hasPrefix("- ") { s = String(s.dropFirst(2)) }
                      for n in labels where s.hasPrefix(n + ":") {
                          s = String(s.dropFirst(n.count + 1)).trimmingCharacters(in: .whitespaces)
                      }
                      if s.count > 1 && s.hasPrefix("\"") && s.hasSuffix("\"") { s = String(s.dropFirst().dropLast()) }
                      if s.count > 1 && s.hasPrefix("*") && s.hasSuffix("*") { continue }
                      if s.count > 1 && s.hasPrefix("(") && s.hasSuffix(")") { continue }
                      s = s.trimmingCharacters(in: .whitespacesAndNewlines)
                      if !s.isEmpty { out.parts.append(s) }
                  }
                  if out.parts.count > 4 {
                      let head = Array(out.parts.prefix(3))
                      let tail = out.parts.dropFirst(3).joined(separator: " ")
                      out.parts = head + [tail]
                  }
                  return out
              }

              // Only events this character may trigger right now count.
              static func validate(role: Role, events: [String], flags: Set<String>) -> Set<String> {
                  var ok: Set<String> = []
                  for id in events {
                      guard let rule = role.events.first(where: { $0.id == id }) else { continue }
                      if flags.contains(id) { continue }
                      if !rule.needs.allSatisfy({ flags.contains($0) }) { continue }
                      if rule.blocks.contains(where: { flags.contains($0) }) { continue }
                      ok.insert(id)
                  }
                  return ok
              }

              // Safety net: very specific phrases count even if the model forgets the tag.
              static func phraseEvents(role: Role, text: String, flags: Set<String>) -> [String] {
                  let padded = " " + Engine.normalize(text) + " "
                  var out: [String] = []
                  for rule in role.events where !rule.phrases.isEmpty {
                      if flags.contains(rule.id) { continue }
                      if !rule.needs.allSatisfy({ flags.contains($0) }) { continue }
                      if rule.blocks.contains(where: { flags.contains($0) }) { continue }
                      let hit = rule.phrases.contains { p in padded.contains(" " + Engine.normalize(p) + " ") }
                      if hit { out.append(rule.id) }
                  }
                  if role.key == "bank" && !flags.contains("bank_verified") {
                      if text.contains("\u{1F319}") || padded.contains(" moon ") { out.append("bank_verified") }
                  }
                  return out
              }
          }
