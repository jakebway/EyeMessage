                  lines.append("")
                  lines.append("I found a phone tonight. It unlocked for me. It isn't mine.")
                  if f.contains("told_pip") {
                      lines.append("It belongs to Ilsabet Vesper, a wishwright. Her apprentice Pip is texting it. Pip says he's a fox. He looks like a cat.")
                  } else {
                      lines.append("Someone called Pip keeps texting it. They seem scared.")
                  }
                  if f.contains("knows_missing") { lines.append("Ilsabet vanished three nights ago, on the Hollow Moon. Her shop locked itself from the outside.") }
                  if f.contains("quest") { lines.append("I said I'd help. Dawn is at 6:14.") }
                  if f.contains("bank_verified") { lines.append("Bank of Ash, Clause 9: the debt is void if Corvin is addressed by his first true name together with the Word Ilsabet left in keeping.") }
                  if f.contains("has_word") { lines.append("Maud gave me the Word: ember and tide. (Don't write it down. Oops.)") }
                  else if f.contains("maud_light") { lines.append("Told Maud to light the lighthouse lamp for Edric's shadow. Waiting.") }
                  if f.contains("has_name") { lines.append("Delphine gave me the Crow King's true name: Aldous Rook.") }
                  else if f.contains("delphine_try") { lines.append("Suggested Delphine startle Bram out of the love charm.") }
                  if f.contains("tam_song") { lines.append("Paid Old Tam a song. He's holding back the dawn with cloud.") }
                  if f.contains("parcel_burned") { lines.append("Had Moon Mail burn Corvin's feather. It was listening.") }
                  if f.contains("has_word") && f.contains("has_name") && !f.contains("hill_open") { lines.append("I have the Word and the Name. Next: Corvin.") }
                  if f.contains("hill_open") { lines.append("I said them both to Corvin. The Hill opened. Now I have to choose.") }
                  if f.contains("end_return") { lines.append("I chose to free her. She's home.") }
                  if f.contains("end_keep") { lines.append("I kept the Whisper. I suppose I work here now.") }
                  if f.contains("end_break") { lines.append("I broke the Whisper. It's just a phone now.") }
                  if f.contains("end_dark") { lines.append("I gave it to him. I can hear wings.") }
                  if let n = name { lines.append(""); lines.append("(\(n))") }
                  return lines.joined(separator: "\n")
              }
          }
