          import SwiftUI

          // MARK: glass (real Liquid Glass when built with the iOS 26+ SDK, material otherwise)

          struct GlassBackground<S: Shape>: ViewModifier {
              let shape: S

              func body(content: Content) -> some View {
                  #if compiler(>=6.2)
                  if #available(iOS 26.0, *) {
                      content.glassEffect(.regular.interactive(), in: shape)
                  } else {
                      content
                          .background(.ultraThinMaterial, in: shape)
                          .overlay(shape.stroke(Color.primary.opacity(0.08), lineWidth: 0.5))
                  }
                  #else
                  content
                      .background(.ultraThinMaterial, in: shape)
                      .overlay(shape.stroke(Color.primary.opacity(0.08), lineWidth: 0.5))
                  #endif
              }
          }

          extension View {
              func glass<S: Shape>(_ shape: S) -> some View { modifier(GlassBackground(shape: shape)) }
          }

          struct GlassIcon: View {
              let name: String
              var size: CGFloat = 44

              var body: some View {
                  Image(systemName: name)
                      .font(.system(size: 17, weight: .semibold))
                      .foregroundStyle(.primary)
                      .frame(width: size, height: size)
                      .glass(Circle())
              }
          }

          struct PressableStyle: ButtonStyle {
              func makeBody(configuration: Configuration) -> some View {
                  configuration.label
                      .scaleEffect(configuration.isPressed ? 0.92 : 1)
                      .animation(.spring(response: 0.25, dampingFraction: 0.6), value: configuration.isPressed)
              }
          }

          // MARK: avatar

          struct Avatar: View {
              let emoji: String
              let c1: UInt32
              let c2: UInt32
              let initials: String
              var size: CGFloat = 50

              init(convo: Conversation, size: CGFloat = 50) {
                  self.emoji = convo.emoji
                  self.c1 = convo.c1
                  self.c2 = convo.c2
                  self.initials = convo.initials
                  self.size = size
              }

              init(emoji: String, c1: UInt32, c2: UInt32, initials: String = "", size: CGFloat = 50) {
                  self.emoji = emoji
                  self.c1 = c1
                  self.c2 = c2
                  self.initials = initials
                  self.size = size
              }

              var body: some View {
                  ZStack {
                      Circle().fill(LinearGradient(colors: [Color(hex: c1), Color(hex: c2)],
                                                   startPoint: .top, endPoint: .bottom))
                      if emoji == "?" {
                          Image(systemName: "person.fill")
                              .font(.system(size: size * 0.5))
                              .foregroundStyle(.white)
                              .offset(y: size * 0.04)
                      } else if emoji.isEmpty {
                          Text(initials)
                              .font(.system(size: size * 0.4, weight: .semibold, design: .rounded))
                              .foregroundStyle(.white)
                      } else {
                          Text(emoji).font(.system(size: size * 0.52))
                      }
                  }
                  .frame(width: size, height: size)
              }
          }

          // MARK: bubble

          struct BubbleShape: Shape {
              var isMe: Bool
              var tail: Bool

              func path(in rect: CGRect) -> Path {
                  let w = rect.width
                  let h = rect.height
                  var p = Path()
                  if tail {
                      p.move(to: CGPoint(x: 20, y: h))
                      p.addLine(to: CGPoint(x: w - 15, y: h))
                      p.addCurve(to: CGPoint(x: w, y: h - 15), control1: CGPoint(x: w - 8, y: h), control2: CGPoint(x: w, y: h - 8))
                      p.addLine(to: CGPoint(x: w, y: 15))
                      p.addCurve(to: CGPoint(x: w - 15, y: 0), control1: CGPoint(x: w, y: 8), control2: CGPoint(x: w - 8, y: 0))
                      p.addLine(to: CGPoint(x: 20, y: 0))
                      p.addCurve(to: CGPoint(x: 5, y: 15), control1: CGPoint(x: 12, y: 0), control2: CGPoint(x: 5, y: 8))
                      p.addLine(to: CGPoint(x: 5, y: h - 10))
                      p.addCurve(to: CGPoint(x: 0, y: h), control1: CGPoint(x: 5, y: h - 1), control2: CGPoint(x: 0, y: h))
                      p.addLine(to: CGPoint(x: -1, y: h))
                      p.addCurve(to: CGPoint(x: 12, y: h - 4), control1: CGPoint(x: 4, y: h + 1), control2: CGPoint(x: 8, y: h - 1))
                      p.addCurve(to: CGPoint(x: 20, y: h), control1: CGPoint(x: 15, y: h), control2: CGPoint(x: 17, y: h))
                      p.closeSubpath()
                  } else {
                      p = Path(roundedRect: CGRect(x: 5, y: 0, width: w - 5, height: h), cornerRadius: 18, style: .continuous)
                  }
                  if isMe {
                      return p.applying(CGAffineTransform(a: -1, b: 0, c: 0, d: 1, tx: w, ty: 0))
                  }
                  return p
              }
          }

          // MARK: typing indicator (iMessage-style bubble with the little trailing circles)

          struct TypingBubble: View {
              var scale: CGFloat = 1

              var body: some View {
                  TimelineView(.animation) { ctx in
                      let t = ctx.date.timeIntervalSinceReferenceDate
                      ZStack(alignment: .bottomLeading) {
                          Circle().fill(Palette.gray)
                              .frame(width: 7 * scale, height: 7 * scale)
                              .offset(x: -4 * scale, y: 5 * scale)
                          Circle().fill(Palette.gray)
                              .frame(width: 14 * scale, height: 14 * scale)
                              .offset(x: 1 * scale, y: -1 * scale)
                          HStack(spacing: 5 * scale) {
                              ForEach(0..<3, id: \.self) { i in
                                  TypingDot(level: TypingBubble.level(t: t, i: i), scale: scale)
                              }
                          }
                          .padding(.horizontal, 13 * scale)
                          .padding(.vertical, 12 * scale)
                          .background(Capsule().fill(Palette.gray))
                          .padding(.leading, 6 * scale)
                      }
                  }
              }

              static func level(t: Double, i: Int) -> Double {
                  let cycle = 1.35
                  let phase = (t / cycle - Double(i) * 0.18).truncatingRemainder(dividingBy: 1.0)
                  let p = phase < 0 ? phase + 1 : phase
                  return p < 0.55 ? sin(p / 0.55 * .pi) : 0
              }
          }

