              @AppStorage("alarm.moonrise") private var a1 = true
              @AppStorage("alarm.dawn") private var a2 = false
              @AppStorage("alarm.333") private var a3 = false

              func untilDawn(_ now: Date) -> String {
                  let cal = Calendar.current
                  var dawn = cal.date(bySettingHour: 6, minute: 14, second: 0, of: now) ?? now
                  if dawn <= now { dawn = cal.date(byAdding: .day, value: 1, to: dawn) ?? dawn }
                  let s = Int(dawn.timeIntervalSince(now))
                  return String(format: "%d:%02d:%02d", s / 3600, (s % 3600) / 60, s % 60)
              }

              func alarm(_ time: String, _ label: String, _ on: Binding<Bool>) -> some View {
                  Toggle(isOn: on) {
