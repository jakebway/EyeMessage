          EOF
          cat > project.yml <<'EOF'
          name: Messages
          options:
            bundleIdPrefix: com.example
          targets:
            Messages:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources: [App]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.messagesclone
                  PRODUCT_NAME: Messages
                  SWIFT_VERSION: "5.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_CFBundleDisplayName: Messages
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
                  MARKETING_VERSION: "3.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF
          cat > scripts/icon.swift <<'EOF'
          import Foundation
          import CoreGraphics
          import ImageIO

          let size = 1024
          let cs = CGColorSpaceCreateDeviceRGB()
          guard let ctx = CGContext(data: nil, width: size, height: size, bitsPerComponent: 8,
                                    bytesPerRow: 0, space: cs,
                                    bitmapInfo: CGImageAlphaInfo.noneSkipLast.rawValue) else {
              fatalError("could not create context")
          }

          // Green gradient background
          let top = CGColor(red: 0.38, green: 0.97, blue: 0.47, alpha: 1)
          let bottom = CGColor(red: 0.04, green: 0.74, blue: 0.16, alpha: 1)
          let grad = CGGradient(colorsSpace: cs, colors: [top, bottom] as CFArray, locations: [0, 1])!
          ctx.drawLinearGradient(grad, start: CGPoint(x: 512, y: 1024), end: CGPoint(x: 512, y: 0), options: [])

          // White speech bubble with a soft shadow
          ctx.setShadow(offset: CGSize(width: 0, height: -14), blur: 34,
                        color: CGColor(red: 0, green: 0.25, blue: 0, alpha: 0.35))
          ctx.setFillColor(CGColor(red: 1, green: 1, blue: 1, alpha: 1))
          ctx.fillEllipse(in: CGRect(x: 170, y: 330, width: 684, height: 520))

          let tail = CGMutablePath()
          tail.move(to: CGPoint(x: 250, y: 430))
          tail.addCurve(to: CGPoint(x: 170, y: 290), control1: CGPoint(x: 245, y: 350), control2: CGPoint(x: 215, y: 310))
          tail.addCurve(to: CGPoint(x: 350, y: 360), control1: CGPoint(x: 250, y: 300), control2: CGPoint(x: 310, y: 335))
          tail.closeSubpath()
          ctx.addPath(tail)
          ctx.fillPath()

          // A small gold spark: the only hint that this is no ordinary phone
          ctx.setShadow(offset: .zero, blur: 0, color: nil)
          let cx: CGFloat = 760, cy: CGFloat = 770, r: CGFloat = 78, k: CGFloat = 14
          let star = CGMutablePath()
          star.move(to: CGPoint(x: cx, y: cy + r))
          star.addQuadCurve(to: CGPoint(x: cx + r, y: cy), control: CGPoint(x: cx + k, y: cy + k))
          star.addQuadCurve(to: CGPoint(x: cx, y: cy - r), control: CGPoint(x: cx + k, y: cy - k))
          star.addQuadCurve(to: CGPoint(x: cx - r, y: cy), control: CGPoint(x: cx - k, y: cy - k))
          star.addQuadCurve(to: CGPoint(x: cx, y: cy + r), control: CGPoint(x: cx - k, y: cy + k))
          star.closeSubpath()
          ctx.setFillColor(CGColor(red: 1.0, green: 0.85, blue: 0.35, alpha: 1))
          ctx.addPath(star)
          ctx.fillPath()

          guard let image = ctx.makeImage() else { fatalError("no image") }
          let url = URL(fileURLWithPath: CommandLine.arguments[1]) as CFURL
          guard let dest = CGImageDestinationCreateWithURL(url, "public.png" as CFString, 1, nil) else {
              fatalError("no destination")
          }
          CGImageDestinationAddImage(dest, image, nil)
          if !CGImageDestinationFinalize(dest) { fatalError("could not write png") }
          EOF

      - name: Use the newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Draw app icon
        run: swift scripts/icon.swift App/Assets.xcassets/AppIcon.appiconset/icon.png

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Messages.xcodeproj \
            -scheme Messages \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { echo "::group::Compile errors"; grep -E "error:" build.log | sort -u | head -60; echo "::endgroup::"; grep -E "error:" build.log | sort -u | head -15 | while read -r l; do echo "::error::$l"; done; exit 1; }
          tail -5 build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Messages.app Payload/
          zip -qr Messages.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Messages-ipa
          path: Messages.ipa
