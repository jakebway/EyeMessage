                      Ping(to: "ilsabet", text: "I felt the Whisper die from inside the hill. I thought I would be sadder.||Thank you for not asking whether I'd have wanted that. I'd have said no. I'd have been wrong. 🌙", delay: 20, rename: "Ilsabet Vesper")
                  ]),
                  Trigger(id: "end_dark", when: ["end_dark"], pings: [
