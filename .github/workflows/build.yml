          import SwiftUI
          import AVFoundation

          enum AppID: String {
              case home, messages, phone, notes, calendar, weather, settings, clock, contacts
          }

          @MainActor
          final class PhoneNav: ObservableObject {
              @Published var app: AppID = .home
              @Published var locked = true
              @Published var messagesPath: [UUID] = []
              @Published var anchor: UnitPoint = .center
              @Published var spotlight = false
              var iconFrames: [AppID: CGRect] = [:]
              @Published var safeTop: CGFloat = 59
              var screen: CGSize = CGSize(width: 393, height: 852)

              static let launch = Animation.spring(response: 0.42, dampingFraction: 0.86)

              func unit(for a: AppID) -> UnitPoint {
                  guard let f = iconFrames[a], screen.width > 0, screen.height > 0 else { return .center }
                  return UnitPoint(x: f.midX / screen.width, y: f.midY / screen.height)
              }

              func open(_ a: AppID) {
                  if a == .home { goHome(); return }
                  anchor = unit(for: a)
                  DispatchQueue.main.async {
                      withAnimation(PhoneNav.launch) { self.app = a }
                  }
              }

              func goHome() {
                  guard app != .home else { return }
                  anchor = unit(for: app)
                  DispatchQueue.main.async {
                      withAnimation(PhoneNav.launch) { self.app = .home }
                  }
              }

              func openChat(_ id: UUID) {
                  anchor = UnitPoint(x: 0.5, y: 0.08)
                  messagesPath = [id]
                  DispatchQueue.main.async {
                      withAnimation(PhoneNav.launch) {
                          self.locked = false
                          self.app = .messages
                      }
                  }
              }

              func unlock() {
                  UIImpactFeedbackGenerator(style: .light).impactOccurred()
                  withAnimation(.spring(response: 0.5, dampingFraction: 0.9)) { locked = false }
              }
          }

          struct PhoneRoot: View {
              @StateObject private var store = ChatStore()
              @StateObject private var nav = PhoneNav()
              @State private var feathers = false
              @State private var systemScheme: ColorScheme = PhoneRoot.currentSystemScheme()

              // The phone's own appearance setting (not the app's override).
              static func currentSystemScheme() -> ColorScheme {
                  UIScreen.main.traitCollection.userInterfaceStyle == .dark ? .dark : .light
              }

              @ViewBuilder var appView: some View {
                  switch nav.app {
                  case .messages: MessagesRoot()
                  case .phone: PhoneApp()
                  case .notes: NotesApp()
                  case .calendar: CalendarApp()
                  case .weather: WeatherApp()
                  case .settings: SettingsApp()
                  case .clock: ClockApp()
                  case .contacts: ContactsApp()
                  case .home: EmptyView()
                  }
              }

              var onSpringboard: Bool { nav.locked || nav.app == .home }

              var body: some View {
                  GeometryReader { geo in
                      ZStack {
                          HomeScreen()
                              .scaleEffect(nav.locked ? 1.12 : (nav.app == .home ? 1 : 0.9))
                              .blur(radius: nav.app == .home ? 0 : 6)
                              .opacity(nav.locked ? 0 : 1)
                          if nav.app != .home {
                              appView
                                  .background(Color(.systemBackground))
                                  .clipShape(RoundedRectangle(cornerRadius: 52, style: .continuous))
                                  .transition(.scale(scale: 0.06, anchor: nav.anchor).combined(with: .opacity))
                                  .zIndex(1)
                          }
                          if nav.spotlight {
                              Spotlight()
                                  .transition(.opacity)
                                  .zIndex(1.5)
                          }
                          if nav.locked {
                              LockScreen()
                                  .transition(.move(edge: .top))
                                  .zIndex(2)
                          }
