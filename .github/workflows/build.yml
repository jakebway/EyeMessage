              // MARK: story triggers

              private func schedule(_ ping: Ping) {
                  let ep = epoch
                  Task { @MainActor in
                      await ChatStore.sleep(ping.delay)
                      guard self.epoch == ep, let cid = self.ensureConversation(ping.to) else { return }
                      if let r = ping.rename, let i = self.idx(cid) {
                          self.conversations[i].name = r
                          self.conversations[i].emoji = "\u{1F319}"
                          self.conversations[i].c1 = 0x5856D6
                          self.conversations[i].c2 = 0x1C1C3A
