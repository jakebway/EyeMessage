          // A little radar-style map of Harrowmere for the weather widget.
          struct CoastShape: Shape {
              func path(in r: CGRect) -> Path {
                  var p = Path()
                  let w = r.width, h = r.height
                  p.move(to: CGPoint(x: 0, y: 0))
                  p.addLine(to: CGPoint(x: w * 0.56, y: 0))
                  p.addCurve(to: CGPoint(x: w * 0.47, y: h * 0.34), control1: CGPoint(x: w * 0.6, y: h * 0.12), control2: CGPoint(x: w * 0.42, y: h * 0.2))
                  p.addCurve(to: CGPoint(x: w * 0.68, y: h * 0.5), control1: CGPoint(x: w * 0.55, y: h * 0.42), control2: CGPoint(x: w * 0.7, y: h * 0.4))
                  p.addCurve(to: CGPoint(x: w * 0.5, y: h * 0.62), control1: CGPoint(x: w * 0.66, y: h * 0.58), control2: CGPoint(x: w * 0.54, y: h * 0.55))
                  p.addCurve(to: CGPoint(x: w * 0.42, y: h), control1: CGPoint(x: w * 0.44, y: h * 0.75), control2: CGPoint(x: w * 0.47, y: h * 0.9))
                  p.addLine(to: CGPoint(x: 0, y: h))
                  p.closeSubpath()
                  return p
              }
          }

