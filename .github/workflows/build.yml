          struct Spotlight: View {
              @EnvironmentObject var store: ChatStore
              @EnvironmentObject var nav: PhoneNav
              @State private var q = ""
              @FocusState private var focused: Bool

              struct Hit: Identifiable {
                  let id = UUID()
                  let title: String
                  let detail: String
                  let convo: UUID?
                  let app: AppID
              }

              var hits: [Hit] {
                  let s = q.trimmingCharacters(in: .whitespaces)
                  guard !s.isEmpty else { return [] }
                  var out: [Hit] = []
                  if s.lowercased().contains(Roles.trueName.lowercased()) {
                      out.append(Hit(title: "He heard that.", detail: "Names carry, on this phone.", convo: nil, app: .home))
                  }
                  if s.count >= 3 && ("deleted".hasPrefix(s.lowercased()) || s.lowercased().contains("deleted")) {
                      out.append(Hit(title: "Recently Deleted", detail: "Notes · 1 note", convo: nil, app: .notes))
                  }
                  for c in store.sorted where c.name.localizedCaseInsensitiveContains(s) {
                      out.append(Hit(title: c.name, detail: "Contact", convo: c.id, app: .messages))
                  }
                  for c in store.sorted {
                      for m in c.messages.reversed() where m.text.localizedCaseInsensitiveContains(s) {
                          out.append(Hit(title: c.name, detail: m.text, convo: c.id, app: .messages))
                          if out.count > 30 { break }
                      }
                  }
                  for n in Lore.notes where n.password == nil && (n.title.localizedCaseInsensitiveContains(s) || n.body.localizedCaseInsensitiveContains(s)) {
                      out.append(Hit(title: n.title, detail: "Notes", convo: nil, app: .notes))
                  }
                  return Array(out.prefix(40))
              }

              func close() {
                  focused = false
                  withAnimation(.spring(response: 0.35, dampingFraction: 0.86)) { nav.spotlight = false }
              }

              var body: some View {
                  ZStack(alignment: .top) {
                      Rectangle().fill(Material.ultraThin).ignoresSafeArea()
                          .onTapGesture(perform: close)
                      VStack(spacing: 14) {
                          HStack(spacing: 10) {
                              HStack(spacing: 8) {
                                  Image(systemName: "magnifyingglass").foregroundStyle(.secondary)
                                  TextField("Search", text: $q)
                                      .focused($focused)
                                      .submitLabel(.search)
                                      .autocorrectionDisabled()
                              }
                              .padding(.horizontal, 14)
                              .padding(.vertical, 11)
                              .glass(Capsule())
                              Button("Cancel", action: close).foregroundStyle(.white)
                          }
                          .padding(.horizontal, 16)
                          .padding(.top, 64)
                          ScrollView {
                              VStack(spacing: 0) {
                                  ForEach(hits) { h in
                                      Button {
                                          close()
                                          if let c = h.convo { nav.openChat(c) } else { nav.open(h.app) }
                                      } label: {
                                          VStack(alignment: .leading, spacing: 2) {
                                              Text(h.title).font(.system(size: 16, weight: .semibold))
                                              Text(h.detail).font(.system(size: 14)).foregroundStyle(.secondary).lineLimit(2)
                                          }
                                          .frame(maxWidth: .infinity, alignment: .leading)
                                          .padding(.vertical, 10)
                                          .padding(.horizontal, 16)
                                      }
                                      .foregroundStyle(.white)
                                      Divider().padding(.leading, 16)
                                  }
                              }
                              .background(Material.ultraThin, in: RoundedRectangle(cornerRadius: 22, style: .continuous))
                              .padding(.horizontal, 16)
                          }
                          .scrollDismissesKeyboard(.interactively)
                      }
                  }
                  .environment(\.colorScheme, .dark)
                  .onAppear { focused = true }
                  .onChange(of: q) { v in
                      if v.lowercased().contains(Roles.trueName.lowercased()) { store.secret("spotlight") }
                  }
              }
          }

          // MARK: feathers (the Hill opening)

          struct FeatherFall: View {
              @State private var start = Date()

              var body: some View {
                  TimelineView(.animation) { ctx in
                      Canvas { g, size in
                          let t = ctx.date.timeIntervalSince(start)
                          var seed: UInt64 = 42
                          func rnd() -> Double {
                              seed = seed &* 6364136223846793005 &+ 1442695040888963407
                              return Double((seed >> 33) % 10000) / 10000
                          }
                          for _ in 0..<38 {
                              let x0 = rnd() * size.width
                              let speed = 90 + rnd() * 140
                              let delay = rnd() * 1.8
                              let sway = 20 + rnd() * 40
                              let phase = rnd() * 6.28
                              let s = 18 + rnd() * 20
                              let tt = max(0, t - delay)
                              let y = -40 + tt * speed
                              let x = x0 + sin(tt * 2 + phase) * sway
                              var copy = g
                              copy.translateBy(x: x, y: y)
                              copy.rotate(by: .radians(sin(tt * 1.6 + phase) * 0.6))
                              copy.draw(Text("\u{1FAB6}").font(.system(size: s)), at: .zero)
                          }
                      }
                  }
                  .background(
                      RadialGradient(colors: [Color.clear, Color.black.opacity(0.75)], center: .center, startRadius: 120, endRadius: 520)
                  )
                  .ignoresSafeArea()
              }
          }
