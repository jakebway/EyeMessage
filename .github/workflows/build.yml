                      Ping(to: "maud", text: "Oh! Oh, dear. It worked.||Edric's shadow came in under the door and it's curled up by the hearth like an old dog.||And the strangest thing, love... with the house feeling like home again, I can hear Gran's old lullaby in my head, clear as a bell.||'Hush now, hush, the crows are calling, / Aldous Rook is at the door, / say his name and down he's falling, / back beneath the hill once more.'||Gran always said never sing the name part near a crow. I don't know why I'm telling you. It just felt like you should know.", delay: 22, sets: ["maud_rhyme", "has_name"])
                  ]),
                  Trigger(id: "delphine_success", when: ["delphine_try"], pings: [
                      Ping(to: "delphine", text: "It WORKED.||I told him the one about the barrister and the badger. He laughed for four minutes, then wept, then asked why there was a hat on the toaster.||He is himself again. Mostly.||I owe you, {name}. Ask me for anything in the Register.", delay: 18, sets: ["delphine_owes"])
                  ]),
                  Trigger(id: "ilsabet_hill", when: ["told_pip"], any: ["knows_missing", "bank_verified", "maud_light", "delphine_try", "quest"], unless: ["end_free", "end_dark"], pings: [
                      Ping(to: "ilsabet", text: "is someone holding my phone||it's all doors down here. this took an hour to send||don't give him the phone 🌙", delay: 30)
                  ]),
                  Trigger(id: "tam_clouds", when: ["tam_song"], pings: [
                      Ping(to: "pip", text: "uh. the sky just went solid grey. like someone put a lid on the town||did you do that?? the crows HATE it", delay: 15),
                      Ping(to: "corvin", text: "Cloud. Thick, sudden and smelling of goat. Tam has been paid, I see.||Dawn will be late. I am still patient.", delay: 40)
                  ]),
                  Trigger(id: "feather", when: ["parcel_burned"], pings: [
                      Ping(to: "corvin", text: "You burned my feather.||That was a gift. It was also an ear. Clever thief.", delay: 15)
                  ]),
                  Trigger(id: "ready", when: ["has_name"], unless: ["end_free", "end_dark"], pings: [
                      Ping(to: "pip", text: "wait. WAIT. you know his name??||ok ok ok. text corvin. say it to him. just say it. with her voice||go", delay: 8)
                  ]),
                  Trigger(id: "secret_333", when: ["secret_333"], unless: ["end_free", "end_dark"], pings: [
                      Ping(to: "corvin", text: "Three thirty-three.||The hour my hill opens its eyes. Who taught you that?", delay: 6)
                  ]),
                  Trigger(id: "end_free", when: ["end_free"], pings: [
                      Ping(to: "pip", text: "SHE'S BACK||she walked in covered in leaves and asked why i'd eaten all the emergency biscuits||thank you. i'm not crying. cats don't", delay: 6),
                      Ping(to: "ilsabet", text: "Well.||I'm standing in my own shop, in my own coat, and every plant is dead. The plants always die.||I don't know who you are, or how you got a fae king's name out of this town in one night.||Thank you. 🌙", delay: 20, rename: "Ilsabet Vesper")
                  ]),
                  Trigger(id: "true_end", when: ["end_free", "secrets4"], pings: [
                      Ping(to: "ilsabet", text: "One more thing.||You found the things I hid in that phone. The deleted note. The locked one. Most people never look that closely.||So you know why I did it. Don't tell Pip.||I could use an apprentice. Pip could use someone new to boss around.||Think about it. 🌙", delay: 48)
                  ]),
                  Trigger(id: "end_dark", when: ["end_dark"], pings: [
                      Ping(to: "pip", text: "what did you do||the shop door just opened by itself||i can hear wings", delay: 8)
                  ])
              ]

              // What Corvin says when his true name is spoken (offline mode).
              static let namedLines = ["...", "Who taught you that name?", "No. It does not matter. It is said, with her voice, and I am bound.", "Take her, then. Tell Vesper she was lucky in her friends, {name}."]
          }
          EOF
          cat > project.yml <<'EOF'
          name: Messages
          options:
            bundleIdPrefix: com.example
          targets:
            Messages:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources: [App]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.messagesclone
                  PRODUCT_NAME: EyeMessage
                  SWIFT_VERSION: "5.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_CFBundleDisplayName: EyeMessage
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
                  MARKETING_VERSION: "3.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

      - name: Use the newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

