                      Ping(to: "maud", text: "Oh! Oh, dear. It worked.||Edric's shadow came in under the door and it's lying across the hearth like a cat.||I promised you a word, didn't I? Ilsabet left it with me for the day the Whisper changed hands.||'Ember and tide'. Don't write it down, dear. Words in ink get stolen.||Do take care of her, wherever she is.", delay: 20, sets: ["has_word"])
                  ]),
                  Trigger(id: "delphine_success", when: ["delphine_try"], pings: [
                      Ping(to: "delphine", text: "It WORKED.||I told him the one about the barrister and the badger. He laughed for four minutes, then wept, then asked why there was a hat on the toaster.||He is himself again. Mostly.||I owe you, {name}. Whoever you are. Ask me for anything in the Register.", delay: 18, sets: ["delphine_owes"])
                  ]),
                  Trigger(id: "ilsabet_hill", when: ["told_pip"], any: ["has_word", "has_name", "bank_verified"], unless: ["hill_open", "end_return", "end_keep", "end_break", "end_dark"], pings: [
                      Ping(to: "ilsabet", text: "is someone holding my whisper||the hill eats words. this took an hour to send||don't give him the phone 🌙", delay: 25)
                  ]),
                  Trigger(id: "tam_clouds", when: ["tam_song"], pings: [
                      Ping(to: "pip", text: "uh. the sky just went solid grey. like someone dropped a lid on the town||did you do that?? crows HATE this", delay: 15),
                      Ping(to: "corvin", text: "Cloud. Thick, sudden and smelling of the moor. Tam has been paid, I see.||Dawn will be late. I am still patient.", delay: 40)
                  ]),
                  Trigger(id: "feather", when: ["parcel_burned"], pings: [
                      Ping(to: "corvin", text: "You burned my feather.||That was a gift. It was also an ear. Clever thief.", delay: 15)
                  ]),
                  Trigger(id: "ready", when: ["has_word", "has_name"], pings: [
                      Ping(to: "pip", text: "wait. WAIT.||you have the word AND the name?? ok. ok. corvin. text him. say them both to him||he'll ask you to choose after. i can't tell you what to choose. i'm sorry", delay: 6)
                  ]),
                  Trigger(id: "hill", when: ["hill_open"], pings: [
                      Ping(to: "pip", text: "the hill!!! i can hear it unlocking from HERE||whatever you pick, pick it fast", delay: 6)
                  ]),
                  Trigger(id: "end_return", when: ["end_return"], pings: [
                      Ping(to: "pip", text: "SHE'S BACK||she walked in the door with her coat on inside out and asked what we'd done to the plants||thank you. i'm not crying. foxes don't", delay: 6),
                      Ping(to: "ilsabet", text: "Well, well.||I'm standing in my own shop, in my coat, and every plant is dead. The plants always die.||I don't know who you are, or how you taught my Whisper to say a crow's name to his face.||Thank you. 🌙", delay: 20, rename: "Ilsabet Vesper")
                  ]),
                  Trigger(id: "end_keep", when: ["end_keep"], pings: [
