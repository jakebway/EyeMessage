                                  .allowsHitTesting(false)
                                  .transition(.opacity)
                                  .zIndex(4)
                          }
                          // Real iOS hides the home indicator on the Home Screen; it shows on the Lock Screen and in apps.
                          if nav.locked || nav.app != .home {
