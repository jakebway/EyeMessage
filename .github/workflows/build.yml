          import SwiftUI

          struct RowModel: Identifiable {
              let id: UUID
              let msg: ChatMessage
              let header: Date?
              let tight: Bool
              let tail: Bool
              let lastMine: Bool
          }

          struct ChatView: View {
              @EnvironmentObject var store: ChatStore
              @Environment(\.dismiss) private var dismiss
              let id: UUID
              @State private var draft = ""
              @State private var reveal: CGFloat = 0
              @State private var showContact = false
              @FocusState private var focused: Bool

              var convo: Conversation? { store.conversations.first { $0.id == id } }

              static func rows(for c: Conversation) -> [RowModel] {
                  var out: [RowModel] = []
                  let msgs = c.messages
                  let lastMineIndex = msgs.lastIndex { $0.isMe }
                  for (i, msg) in msgs.enumerated() {
                      let prev: ChatMessage? = i > 0 ? msgs[i - 1] : nil
                      let next: ChatMessage? = i < msgs.count - 1 ? msgs[i + 1] : nil
                      var header: Date? = nil
                      if let p = prev {
                          if msg.date.timeIntervalSince(p.date) > 3600 { header = msg.date }
                      } else {
                          header = msg.date
                      }
                      var nextBreak = false
                      if let n = next { nextBreak = n.date.timeIntervalSince(msg.date) > 3600 || n.isMe != msg.isMe }
                      let tail = next == nil || nextBreak
                      var tight = false
                      if let p = prev { tight = p.isMe == msg.isMe && header == nil }
                      out.append(RowModel(id: msg.id, msg: msg, header: header, tight: tight, tail: tail,
                                          lastMine: lastMineIndex == i))
                  }
                  return out
              }

              func scrollDown(_ proxy: ScrollViewProxy, animated: Bool = true) {
                  DispatchQueue.main.async {
                      if animated {
                          withAnimation(.spring(response: 0.4, dampingFraction: 0.9)) { proxy.scrollTo("bottom", anchor: .bottom) }
                      } else {
                          proxy.scrollTo("bottom", anchor: .bottom)
                      }
                  }
              }

              func send() {
                  let t = draft.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !t.isEmpty else { return }
                  draft = ""
                  store.send(t, to: id)
              }

              func status(_ c: Conversation, _ row: RowModel) -> String? {
                  guard row.lastMine, row.msg.failed != true else { return nil }
                  if let last = c.messages.last, !last.isMe { return nil }
                  if let seen = c.seenAt { return "Read " + seen.time }
                  return "Delivered"
              }

              var unreadElsewhere: Int { store.unreadCount(except: id) }

              func header(_ c: Conversation) -> some View {
                  ZStack {
                      Button { showContact = true } label: {
                          VStack(spacing: 4) {
                              Avatar(convo: c, size: 50)
                              HStack(spacing: 2) {
                                  Text(c.name).font(.system(size: 12, weight: .medium)).foregroundStyle(.primary)
                                  Image(systemName: "chevron.right")
                                      .font(.system(size: 8, weight: .bold))
                                      .foregroundStyle(.secondary)
                              }
                              .padding(.horizontal, 10)
                              .padding(.vertical, 4)
                              .glass(Capsule())
                          }
                      }
                      .buttonStyle(PressableStyle())
                      HStack {
                          Button { dismiss() } label: {
                              HStack(spacing: 2) {
                                  Image(systemName: "chevron.left").font(.system(size: 17, weight: .semibold))
                                  if unreadElsewhere > 0 {
                                      Text("\(unreadElsewhere)")
                                          .font(.system(size: 15, weight: .semibold))
                                          .contentTransition(.numericText())
                                  }
                              }
                              .foregroundStyle(.primary)
                              .padding(.horizontal, unreadElsewhere > 0 ? 12 : 0)
                              .frame(minWidth: 44, minHeight: 44)
                              .glass(Capsule())
                          }
                          .buttonStyle(PressableStyle())
                          Spacer()
                          Button {} label: { GlassIcon(name: "video") }
                              .buttonStyle(PressableStyle())
                      }
                  }
                  .padding(.horizontal, 16)
                  .padding(.top, 2)
                  .padding(.bottom, 10)
                  .background(
                      LinearGradient(colors: [Color(.systemBackground), Color(.systemBackground).opacity(0.85), Color(.systemBackground).opacity(0)],
                                     startPoint: .top, endPoint: .bottom)
                          .ignoresSafeArea(edges: .top)
                  )
              }

              var inputBar: some View {
                  HStack(alignment: .bottom, spacing: 8) {
                      Button {} label: { GlassIcon(name: "plus", size: 40) }
                          .buttonStyle(PressableStyle())
                      HStack(alignment: .bottom, spacing: 6) {
                          TextField("iMessage", text: $draft, axis: .vertical)
                              .lineLimit(1...6)
                              .focused($focused)
                              .padding(.vertical, 10)
                              .padding(.leading, 16)
                              .submitLabel(.send)
                              .onSubmit(send)
                          ZStack {
                              if draft.trimmingCharacters(in: .whitespaces).isEmpty {
                                  Image(systemName: "mic.fill")
                                      .foregroundStyle(.secondary)
                                      .transition(.scale(scale: 0.5).combined(with: .opacity))
                              } else {
                                  Button(action: send) {
                                      Image(systemName: "arrow.up")
                                          .font(.system(size: 15, weight: .bold))
                                          .foregroundStyle(.white)
                                          .frame(width: 30, height: 30)
                                          .background(Circle().fill(imBlue))
                                  }
                                  .transition(.scale(scale: 0.4).combined(with: .opacity))
                              }
                          }
                          .frame(width: 32, height: 32)
                          .padding(.trailing, 5)
                          .padding(.bottom, 5)
                          .animation(.spring(response: 0.25, dampingFraction: 0.7), value: draft.isEmpty)
                      }
                      .glass(RoundedRectangle(cornerRadius: 21, style: .continuous))
                  }
                  .padding(.horizontal, 12)
                  .padding(.top, 6)
                  .padding(.bottom, 6)
              }

              var swipe: some Gesture {
                  DragGesture(minimumDistance: 14)
                      .onChanged { v in
                          guard abs(v.translation.width) > abs(v.translation.height) * 1.2 else { return }
                          reveal = max(-76, min(0, v.translation.width * 0.75))
                      }
                      .onEnded { _ in
                          withAnimation(.spring(response: 0.35, dampingFraction: 0.85)) { reveal = 0 }
                      }
              }

              func thread(_ c: Conversation) -> some View {
                  ScrollViewReader { proxy in
                      ScrollView {
                          VStack(spacing: 0) {
                              Color.clear.frame(height: 8)
                              ForEach(ChatView.rows(for: c)) { row in
                                  MessageRow(row: row, status: status(c, row), reveal: reveal,
                                             onTapback: { t in store.setTapback(t, message: row.id, in: id) },
                                             onRetry: { store.retry(id) })
                                      .transition(row.msg.isMe ? .imSend : .imReceive)
                              }
                              if store.typing.contains(id) {
                                  TypingBubble()
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .padding(.leading, 12)
                                      .padding(.top, 8)
                                      .transition(.imReceive)
                              }
                              Color.clear.frame(height: 4).id("bottom")
                          }
                          .padding(.horizontal, 4)
                      }
                      .defaultScrollAnchor(.bottom)
                      .scrollDismissesKeyboard(.interactively)
                      .simultaneousGesture(swipe)
                      .onAppear {
                          store.openChat = id
                          store.markRead(id)
                          scrollDown(proxy, animated: false)
                      }
                      .onDisappear {
                          if store.openChat == id { store.openChat = nil }
                      }
                      .onChange(of: c.messages.count) { _ in
                          store.markRead(id)
                          scrollDown(proxy)
                      }
                      .onChange(of: store.typing.contains(id)) { _ in scrollDown(proxy) }
                      .onChange(of: focused) { f in if f { scrollDown(proxy) } }
                  }
              }

              var body: some View {
                  Group {
                      if let c = convo {
                          thread(c)
                              .safeAreaInset(edge: .top, spacing: 0) { header(c) }
                              .safeAreaInset(edge: .bottom, spacing: 0) { inputBar }
                              .sheet(isPresented: $showContact) { ContactSheet(convo: c) }
                      } else {
                          Color(.systemBackground)
                      }
                  }
                  .background(Color(.systemBackground))
                  .navigationBarBackButtonHidden(true)
                  .toolbar(.hidden, for: .navigationBar)
              }
          }

          struct MessageRow: View {
              let row: RowModel
              let status: String?
              let reveal: CGFloat
              let onTapback: (Tapback?) -> Void
              let onRetry: () -> Void

              var msg: ChatMessage { row.msg }
              var tapback: Tapback? { msg.tapback.flatMap { Tapback(rawValue: $0) } }
              var big: Bool { msg.text.isBigEmoji }

              var bubble: some View {
                  Group {
                      if big {
                          Text(msg.text)
                              .font(.system(size: 52))
                              .padding(.horizontal, 6)
                      } else {
                          Text(msg.text)
                              .font(.system(size: 17))
                              .foregroundStyle(msg.isMe ? Color.white : Color.primary)
                              .tint(msg.isMe ? .white : imBlue)
                              .fixedSize(horizontal: false, vertical: true)
                              .padding(.leading, msg.isMe ? 12 : 17)
                              .padding(.trailing, msg.isMe ? 17 : 12)
                              .padding(.vertical, 8)
                              .background(
                                  BubbleShape(isMe: msg.isMe, tail: row.tail)
                                      .fill(msg.isMe ? imBlue : Palette.gray)
                              )
                              .opacity(msg.failed == true ? 0.75 : 1)
                      }
                  }
                  .contentShape(.contextMenuPreview, BubbleShape(isMe: msg.isMe, tail: row.tail))
                  .contextMenu {
                      ForEach(Tapback.allCases, id: \.self) { t in
                          Button { onTapback(t) } label: { Label(t.label, systemImage: t.symbol) }
                      }
                      Divider()
                      Button { UIPasteboard.general.string = msg.text } label: { Label("Copy", systemImage: "doc.on.doc") }
                      if msg.failed == true {
                          Button { onRetry() } label: { Label("Try Again", systemImage: "arrow.clockwise") }
                      }
                  }
                  .overlay(alignment: msg.isMe ? .topLeading : .topTrailing) {
                      if let t = tapback {
                          TapbackBadge(tapback: t, mine: msg.tapbackMine == true)
                              .offset(x: msg.isMe ? -14 : 14, y: -18)
                      }
                  }
                  .onTapGesture(count: 2) { onTapback(.love) }
              }

              var line: some View {
                  HStack(alignment: .bottom, spacing: 6) {
                      if msg.isMe { Spacer(minLength: 56) }
                      bubble
                      if msg.failed == true {
                          Button(action: onRetry) {
                              Image(systemName: "exclamationmark.circle.fill")
                                  .font(.system(size: 22))
                                  .foregroundStyle(.red)
                          }
                          .transition(.scale.combined(with: .opacity))
                      }
                      if !msg.isMe { Spacer(minLength: 56) }
                  }
                  .offset(x: msg.isMe ? reveal : 0)
                  .overlay(alignment: .trailing) {
                      Text(msg.date.time)
                          .font(.system(size: 11))
                          .foregroundStyle(.secondary)
                          .fixedSize()
                          .offset(x: 72 + reveal)
                          .opacity(Double(-reveal / 76))
                  }
              }

              var body: some View {
                  VStack(alignment: msg.isMe ? .trailing : .leading, spacing: 2) {
                      if let h = row.header {
                          h.headerText()
                              .font(.system(size: 11))
                              .foregroundStyle(.secondary)
                              .frame(maxWidth: .infinity)
                              .padding(.top, 14)
                              .padding(.bottom, 8)
                      }
                      line
                          .padding(.top, row.tight ? 2 : 8)
                          .padding(.top, tapback != nil ? 14 : 0)
                      if msg.failed == true {
                          Button(action: onRetry) {
                              Text("Not Delivered").font(.system(size: 11, weight: .medium)).foregroundStyle(.red)
                          }
                          .padding(.trailing, 8)
                          .padding(.top, 2)
                          .transition(.opacity)
                      } else if let s = status {
                          Text(s)
                              .font(.system(size: 11, weight: .medium))
                              .foregroundStyle(.secondary)
                              .padding(.trailing, 8)
                              .padding(.top, 2)
                              .id(s)
                              .transition(.opacity)
                      }
                  }
                  .padding(.horizontal, 8)
                  .frame(maxWidth: .infinity, alignment: msg.isMe ? .trailing : .leading)
              }
