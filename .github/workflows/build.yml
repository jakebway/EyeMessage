name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Every day after Cloudflare's free allowance resets: draw any photos still missing.
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: eyemessage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.draw.outputs.changed }}
