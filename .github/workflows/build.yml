name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write app source
        run: |
          mkdir -p App scripts App/Assets.xcassets/AppIcon.appiconset
          cat > App/MessagesApp.swift <<'EOF'
