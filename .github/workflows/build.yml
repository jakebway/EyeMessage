                          .textInputAutocapitalization(.never)
                          .autocorrectionDisabled()
                      TextField("Base URL", text: $base)
                          .textInputAutocapitalization(.never)
                          .autocorrectionDisabled()
                          .keyboardType(.URL)
                      TextField("Model", text: $model)
                          .textInputAutocapitalization(.never)
                          .autocorrectionDisabled()
                      Button { runTest() } label: {
