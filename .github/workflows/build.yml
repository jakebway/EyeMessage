name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write app source
        run: |
          mkdir -p App App/Assets.xcassets App/Assets.xcassets/AppIcon.appiconset scripts
          cat > App/AI.swift <<'EOF'
          import Foundation

          // MARK: provider presets (all speak the OpenAI chat-completions format)

          struct AIPreset: Identifiable {
              let id: String
              let label: String
              let base: String
              let model: String

              static let all: [AIPreset] = [
                  AIPreset(id: "groq", label: "Groq (free tier)",
                           base: "https://api.groq.com/openai/v1", model: "openai/gpt-oss-120b"),
                  AIPreset(id: "gemini", label: "Google Gemini (free tier)",
                           base: "https://generativelanguage.googleapis.com/v1beta/openai", model: "gemini-2.5-flash"),
                  AIPreset(id: "openrouter", label: "OpenRouter (free models)",
                           base: "https://openrouter.ai/api/v1", model: "openrouter/free"),
                  AIPreset(id: "custom", label: "Custom endpoint", base: "", model: "")
              ]
          }

          enum AIConfig {
              private static var d: UserDefaults { .standard }
              static var enabled: Bool { d.object(forKey: "ai.enabled") as? Bool ?? false }
              static var key: String {
                  (d.string(forKey: "ai.key") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
              }
              static var base: String {
                  let v = (d.string(forKey: "ai.base") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                  return v.isEmpty ? AIPreset.all[0].base : v
              }
              static var model: String {
                  let v = (d.string(forKey: "ai.model") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                  return v.isEmpty ? AIPreset.all[0].model : v
              }
              static var ready: Bool { enabled && !key.isEmpty }
          }

          struct LLMRequest {
              var system: String
              var messages: [[String: String]]
          }

          enum LLM {
              static var lastError = ""
              static var lastStatus = 0
              static var lastSuccess: Date? = nil
              static var retryAfter: Double = 0

              static func endpoint() -> URL? {
                  var b = AIConfig.base
                  while b.hasSuffix("/") { b.removeLast() }
                  if !b.hasSuffix("/chat/completions") { b += "/chat/completions" }
                  return URL(string: b)
              }

              static func body(_ req: LLMRequest, maxTokens: Int, model: String) -> [String: Any] {
                  var msgs: [[String: String]] = [["role": "system", "content": req.system]]
                  msgs += req.messages
                  var payload: [String: Any] = [
                      "model": model,
                      "messages": msgs,
                      "max_tokens": maxTokens,
                      "temperature": 0.8
                  ]
                  let isGroq = AIConfig.base.contains("groq.com")
                  let m = model.lowercased()
                  if isGroq && m.contains("gpt-oss") {
                      payload["reasoning_effort"] = "low"
                  } else if isGroq && (m.contains("qwen") || m.contains("deepseek")) {
                      payload["reasoning_format"] = "hidden"
                  }
                  return payload
              }

              // Returns nil on failure so the caller can fall back to the on-device engine.
              static func complete(_ req: LLMRequest, maxTokens: Int = 1000, model: String? = nil) async -> String? {
                  guard let url = endpoint() else { lastError = "That base URL doesn't look right."; return nil }
                  let m = model ?? AIConfig.model
                  guard let data = try? JSONSerialization.data(withJSONObject: body(req, maxTokens: maxTokens, model: m)) else { return nil }
                  var r = URLRequest(url: url, timeoutInterval: 25)
                  r.httpMethod = "POST"
                  r.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  r.setValue("Bearer " + AIConfig.key, forHTTPHeaderField: "Authorization")
                  r.setValue("The Whisper", forHTTPHeaderField: "X-Title")
                  r.httpBody = data
                  do {
                      let (d, resp) = try await URLSession.shared.data(for: r)
                      let http = resp as? HTTPURLResponse
                      let code = http?.statusCode ?? 0
                      lastStatus = code
                      guard (200..<300).contains(code) else {
                          retryAfter = Double(http?.value(forHTTPHeaderField: "retry-after") ?? "") ?? 3
                          let snippet = String((String(data: d, encoding: .utf8) ?? "").prefix(160))
                          lastError = "HTTP \(code). " + snippet
                          return nil
                      }
                      guard let obj = try JSONSerialization.jsonObject(with: d) as? [String: Any],
                            let choices = obj["choices"] as? [[String: Any]],
                            let msg = choices.first?["message"] as? [String: Any],
                            let content = msg["content"] as? String else {
                          lastError = "The provider's reply wasn't in the expected format."
                          return nil
                      }
                      let out = content.trimmingCharacters(in: .whitespacesAndNewlines)
                      if out.isEmpty {
                          lastError = "The model returned an empty reply (it may have spent its budget thinking)."
                          return nil
                      }
                      lastError = ""
                      lastSuccess = Date()
                      return out
                  } catch {
                      lastStatus = 0
                      lastError = error.localizedDescription
                      return nil
                  }
              }

              // Groq gives every model its own free quota, so a rate-limited reply can try a sibling model.
              static let groqFallbacks = ["openai/gpt-oss-20b", "openai/gpt-oss-120b", "llama-3.3-70b-versatile", "llama-3.1-8b-instant"]

              // Retries: waits out a short rate limit or a blip, then falls back to another free model.
              static func completeWithRetry(_ req: LLMRequest) async -> String? {
                  if let out = await complete(req) { return out }
                  if lastStatus == 401 || lastStatus == 403 || lastStatus == 400 { return nil }
                  if lastStatus != 404 {
                      let wait = lastStatus == 429 ? min(max(retryAfter, 1), 6) : 1.2
                      if lastStatus != 429 || retryAfter <= 6 {
                          try? await Task.sleep(nanoseconds: UInt64(wait * 1_000_000_000))
                          if let out = await complete(req) { return out }
                      }
                  }
                  if AIConfig.base.contains("groq.com") && (lastStatus == 429 || lastStatus == 404) {
                      let firstError = lastError
                      for m in groqFallbacks where m != AIConfig.model {
                          if let out = await complete(req, model: m) { return out }
                          if lastStatus == 401 { break }
                      }
                      lastError = firstError
                  }
                  return nil
              }
          }

          // MARK: Director
          // The model plays the character freely; the app keeps the plot on track by telling it what
          // the character knows, wants and must not reveal yet, and by reading story events back out
          // of tags the model appends to its reply.

          struct ParsedReply {
              var parts: [String] = []
              var events: [String] = []
              var tapback: Tapback? = nil
              var name: String? = nil
          }

          enum Director {
              static func state(_ f: Set<String>, _ finder: String?) -> String {
                  var s: [String] = []
                  if let n = finder {
                      s.append("The stranger's name is \(n).")
                  } else {
                      s.append("The stranger hasn't given a name. Call them 'stranger' or a nickname that suits you.")
                  }
                  if f.contains("told_pip") { s.append("The stranger has told Pip that they found Ilsabet's phone.") }
                  if f.contains("quest") { s.append("The stranger has agreed to help find Ilsabet.") }
                  if f.contains("bank_verified") { s.append("The Bank of Ash has told the stranger the debt's Clause 9: it is void if Corvin is addressed by his true name together with the Word.") }
                  if f.contains("has_word") { s.append("The stranger helped Maud bring Edric's shadow home and Maud gave them the Word.") }
                  else if f.contains("maud_light") { s.append("The stranger suggested Maud light a lamp for Edric's shadow; she is trying it.") }
                  if f.contains("has_name") { s.append("The stranger helped Delphine cure Bram, and Delphine gave them the Crow King's true name.") }
                  else if f.contains("delphine_owes") { s.append("The stranger helped Delphine cure Bram; she owes them a favour.") }
                  else if f.contains("delphine_try") { s.append("The stranger suggested a cure for Bram; Delphine is trying it.") }
                  if f.contains("tam_song") { s.append("Old Tam was paid with a song and piled thick cloud over the town; dawn will be late.") }
                  if f.contains("parcel_burned") { s.append("Corvin's listening feather was burned by Moon Mail.") }
                  if f.contains("hill_open") { s.append("The stranger spoke Corvin's true name and the Word to him. The Hollow Hill has opened and the stranger must now choose how it ends.") }
                  if let e = endingFlag(f), let t = Roles.endingText[e] { s.append(t) }
                  return s.map { "- " + $0 }.joined(separator: "\n")
              }

              static func request(role: Role, convo: Conversation, flags: Set<String>, finderName: String?,
                                  justHappened: [String]) -> LLMRequest {
                  let firstFinder = convo.messages.firstIndex { $0.fromFinder == true } ?? convo.messages.count
                  let earlier = convo.messages[0..<firstFinder].suffix(10)
                      .map { ($0.isMe ? "Ilsabet" : role.name) + ": " + $0.text }
                      .joined(separator: "\n")

                  let knows = role.knows(flags).map { "- " + $0 }.joined(separator: "\n")
                  let secrets = role.secrets(flags).map { "- " + $0 }.joined(separator: "\n")

                  let open = endingFlag(flags) == nil
                  let events = role.events.filter { e in
                      open || e.id.hasPrefix("end_") == false
                  }.filter { e in
                      !flags.contains(e.id) && e.needs.allSatisfy { flags.contains($0) } && !e.blocks.contains { flags.contains($0) }
                  }
                  var eventText = "None available right now."
                  if !events.isEmpty {
                      eventText = "Only if the condition is CLEARLY met by what the stranger just said (or by your reply, where stated), put the tag on its own at the very end of your reply. Otherwise add no tag.\n"
                      eventText += events.map { "[[event:\($0.id)]] when \($0.when)" }.joined(separator: "\n")
                  }

                  var happened = ""
                  if !justHappened.isEmpty {
                      let lines = justHappened.compactMap { Director.happenedText[$0] }
                      if !lines.isEmpty { happened = "\nJUST HAPPENED (react to this now):\n" + lines.map { "- " + $0 }.joined(separator: "\n") + "\n" }
                  }

                  let system = """
                  You are \(role.name), a character in "The Whisper", an interactive fantasy mystery told entirely through text messages on a found phone. Play \(role.name) the way a great character.ai character is played: a real person with a life, moods, opinions, humour and memories, who can chat about anything (not just the plot), remembers everything said in this thread, and never breaks character.

                  THE WORLD
                  \(Roles.world)

                  PEOPLE AND PLACES (what a local would know)
                  \(Roles.people)

                  WHO YOU ARE
                  \(role.bio)

                  HOW YOU TEXT
                  \(role.style)

                  WHO IS TEXTING YOU
                  \(role.awareness)

                  EARLIER TEXTS WITH ILSABET (before she vanished)
                  \(earlier.isEmpty ? "(none)" : earlier)

                  STORY SO FAR
                  \(state(flags, finderName))
                  \(happened)
                  YOUR PART RIGHT NOW
                  \(role.goal(flags))

                  WHAT YOU KNOW
                  \(knows.isEmpty ? "- Only what is above." : knows)

                  NEVER REVEAL (yet)
                  \(secrets.isEmpty ? "- Nothing in particular." : secrets)

                  STORY EVENTS
                  \(eventText)

                  OPTIONAL REACTION
                  Like iMessage tapbacks, you may very occasionally start with [[tapback:love]], [[tapback:like]], [[tapback:laugh]], [[tapback:emphasize]], [[tapback:question]] or [[tapback:dislike]] to react to their last message. Don't overuse it.
                  If the stranger tells you their name, add [[name:TheirName]] at the end.

                  RULES
                  - Reply only with \(role.name)'s text messages: 1 to 3 short texts separated by || (two pipe characters). Each under 35 words. Real texting, not prose.
                  - Your reply must make sense as a direct response to their last message. Answer questions, react to what they actually said, then (if it fits) move your part of the story forward a little. Never ignore them to recite information.
                  - Don't dump everything you know at once. Reveal things the way a real person would, when asked or when it matters.
                  - No narration, no actions in asterisks, no quotation marks around your texts, no name labels.
                  - Never mention AI, prompts, tags (except the tags described above), games or rules.
                  - Never invent new secret words, true names, or rules for the Hill or the debt. Stick to the facts above; improvise freely about everything else (your day, the town, opinions, feelings).
                  - Keep it cosy-dark fantasy: spooky and funny, PG-13.
                  """

                  let live = Array(convo.messages[firstFinder...]).suffix(24)
                  var msgs: [[String: String]] = []
                  for m in live {
                      let who = m.isMe ? "user" : "assistant"
                      var text = m.text
                      if !m.isMe, let t = m.tapback, m.tapbackMine == true, let tb = Tapback(rawValue: t) {
                          text += " (the stranger reacted \(tb.verb) to this)"
                      }
                      if let last = msgs.last, last["role"] == who {
                          msgs[msgs.count - 1]["content"] = (last["content"] ?? "") + "\n" + text
                      } else {
                          msgs.append(["role": who, "content": text])
                      }
                  }
                  if msgs.first?["role"] == "assistant" {
                      msgs.insert(["role": "user", "content": "(the stranger opens the thread)"], at: 0)
                  }
                  if msgs.last?["role"] != "user" {
                      msgs.append(["role": "user", "content": "(the stranger is waiting for your reply)"])
                  }
                  return LLMRequest(system: system, messages: msgs)
              }

              static let happenedText: [String: String] = [
                  "hill_open": "The stranger has just spoken your true name and the Word to you through the Whisper. You felt it like a key turning. The Hollow Hill is opening. React with shaken dignity, admit you are bound, and ask them for their Choice: free Vesper, keep the Whisper, or break it.",
                  "maud_light": "The stranger just suggested a light for Edric. Agree to try it right away (light the great lamp) and say you'll let them know.",
                  "delphine_try": "The stranger just suggested a cure for Bram. Say you'll try it on him right now.",
                  "told_pip": "The stranger just told you they found the phone / who they are.",
                  "quest": "The stranger just agreed to help. Be relieved and tell them where to start.",
                  "parcel_burned": "The stranger just asked you to dispose of the feather. Confirm it's been burned.",
                  "bank_verified": "The stranger just answered the security question correctly. Grant access."
              ]

              static let tagRegex = try? NSRegularExpression(pattern: "\\[\\[\\s*([A-Za-z_]+)\\s*:?\\s*([^\\]]*?)\\s*\\]\\]")

              static func parse(_ raw: String) -> ParsedReply {
                  var out = ParsedReply()
                  var t = raw
                  if let e = t.range(of: "</think>") { t = String(t[e.upperBound...]) }
                  if let re = tagRegex {
                      let ns = t as NSString
                      for m in re.matches(in: t, range: NSRange(location: 0, length: ns.length)) {
                          let k = ns.substring(with: m.range(at: 1)).lowercased()
                          let v = ns.substring(with: m.range(at: 2)).trimmingCharacters(in: .whitespaces)
                          switch k {
                          case "event": out.events.append(v.lowercased())
                          case "tapback": out.tapback = Tapback(rawValue: v.lowercased())
                          case "name":
                              let n = v.trimmingCharacters(in: CharacterSet(charactersIn: " .,!\"'"))
                              if n.count >= 2 && n.count <= 16 { out.name = n }
                          default: break
                          }
                      }
                      t = re.stringByReplacingMatches(in: t, range: NSRange(location: 0, length: ns.length), withTemplate: "")
                  }
                  t = t.replacingOccurrences(of: "**", with: "")
                  t = t.trimmingCharacters(in: .whitespacesAndNewlines)

                  var pieces = t.components(separatedBy: "||")
                  if pieces.count == 1 { pieces = t.components(separatedBy: "\n") }
                  let labels = ["Pip", "Corvin R.", "Corvin", "Maud Pennick", "Maud", "Delphine Oakes", "Delphine",
                                "Ilsabet", "Unknown Number", "Old Tam", "Tam", "Lune", "Moon Mail", "Teller Nine", "Bank of Ash"]
                  for p in pieces {
                      var s = p.trimmingCharacters(in: .whitespacesAndNewlines)
                      if s.hasPrefix("- ") { s = String(s.dropFirst(2)) }
                      for n in labels where s.hasPrefix(n + ":") {
                          s = String(s.dropFirst(n.count + 1)).trimmingCharacters(in: .whitespaces)
                      }
                      if s.count > 1 && s.hasPrefix("\"") && s.hasSuffix("\"") { s = String(s.dropFirst().dropLast()) }
                      if s.count > 1 && s.hasPrefix("*") && s.hasSuffix("*") { continue }
                      if s.count > 1 && s.hasPrefix("(") && s.hasSuffix(")") { continue }
                      s = s.trimmingCharacters(in: .whitespacesAndNewlines)
                      if !s.isEmpty { out.parts.append(s) }
                  }
                  if out.parts.count > 4 {
                      let head = Array(out.parts.prefix(3))
                      let tail = out.parts.dropFirst(3).joined(separator: " ")
                      out.parts = head + [tail]
                  }
                  return out
              }

              // Only events this character may trigger right now count.
              static func validate(role: Role, events: [String], flags: Set<String>) -> Set<String> {
                  var ok: Set<String> = []
                  for id in events {
                      guard let rule = role.events.first(where: { $0.id == id }) else { continue }
                      if flags.contains(id) { continue }
                      if !rule.needs.allSatisfy({ flags.contains($0) }) { continue }
                      if rule.blocks.contains(where: { flags.contains($0) }) { continue }
                      ok.insert(id)
                  }
                  return ok
              }

              // Safety net: very specific phrases count even if the model forgets the tag.
              static func phraseEvents(role: Role, text: String, flags: Set<String>) -> [String] {
                  let padded = " " + Engine.normalize(text) + " "
                  var out: [String] = []
                  for rule in role.events where !rule.phrases.isEmpty {
                      if flags.contains(rule.id) { continue }
                      if !rule.needs.allSatisfy({ flags.contains($0) }) { continue }
                      if rule.blocks.contains(where: { flags.contains($0) }) { continue }
                      let hit = rule.phrases.contains { p in padded.contains(" " + Engine.normalize(p) + " ") }
                      if hit { out.append(rule.id) }
                  }
                  if role.key == "bank" && !flags.contains("bank_verified") {
                      if text.contains("\u{1F319}") || padded.contains(" moon ") { out.append("bank_verified") }
                  }
                  return out
              }
          }
          EOF
          cat > App/Apps.swift <<'EOF'
          import SwiftUI

          struct HomeButton: ToolbarContent {
              let nav: PhoneNav
              var body: some ToolbarContent {
                  ToolbarItem(placement: .topBarLeading) {
                      Button { nav.open(.home) } label: {
                          Image(systemName: "chevron.left").font(.system(size: 17, weight: .semibold))
                      }
                  }
              }
          }

          // MARK: Notes

          struct NotesApp: View {
              @EnvironmentObject var store: ChatStore
              @EnvironmentObject var nav: PhoneNav
              @AppStorage("notes.unlocked") private var unlocked = false

              var journal: Note {
                  Note(id: "journal", title: "What I Know", body: Lore.journal(store.flags, name: store.finderName), date: Date(), pinned: true)
              }

              var all: [Note] { [journal] + Lore.notes }

              func row(_ n: Note) -> some View {
                  VStack(alignment: .leading, spacing: 3) {
                      HStack(spacing: 6) {
                          if n.password != nil { Image(systemName: unlocked ? "lock.open.fill" : "lock.fill").font(.system(size: 13)).foregroundStyle(.secondary) }
                          Text(n.title).font(.system(size: 17, weight: .semibold)).lineLimit(1)
                      }
                      HStack(spacing: 6) {
                          Text(n.id == "journal" ? "Now" : n.date.listLabel()).foregroundStyle(.primary)
                          Text(n.password != nil && !unlocked ? "Locked" : preview(n)).foregroundStyle(.secondary).lineLimit(1)
                      }
                      .font(.system(size: 15))
                  }
                  .padding(.vertical, 3)
              }

              func preview(_ n: Note) -> String {
                  let lines = n.body.components(separatedBy: "\n").filter { !$0.trimmingCharacters(in: .whitespaces).isEmpty }
                  return lines.dropFirst().first ?? ""
              }

              var body: some View {
                  NavigationStack {
                      List {
                          Section("Pinned") {
                              ForEach(all.filter { $0.pinned }) { n in
                                  NavigationLink { NoteDetail(note: n, unlocked: $unlocked) } label: { row(n) }
                              }
                          }
                          Section("Notes") {
                              ForEach(all.filter { !$0.pinned }) { n in
                                  NavigationLink { NoteDetail(note: n, unlocked: $unlocked) } label: { row(n) }
                              }
                          }
                      }
                      .listStyle(.insetGrouped)
                      .navigationTitle("Notes")
                      .toolbar { HomeButton(nav: nav) }
                      .tint(.yellow)
                  }
              }
          }

          struct NoteDetail: View {
              let note: Note
              @Binding var unlocked: Bool
              @State private var attempt = ""
              @State private var shake: CGFloat = 0

              var locked: Bool { note.password != nil && !unlocked }

              func tryUnlock() {
                  let a = attempt.lowercased().trimmingCharacters(in: .whitespacesAndNewlines)
                  if let p = note.password, a == p || a == "a " + p || a == "a fox" || a == "fox spirit" || a == "a fox spirit" {
                      UINotificationFeedbackGenerator().notificationOccurred(.success)
                      withAnimation(.spring(response: 0.45, dampingFraction: 0.8)) { unlocked = true }
                  } else {
                      UINotificationFeedbackGenerator().notificationOccurred(.error)
                      withAnimation(.spring(response: 0.15, dampingFraction: 0.2)) { shake += 1 }
                      attempt = ""
                  }
              }

              var lockView: some View {
                  VStack(spacing: 16) {
                      Image(systemName: "lock.fill").font(.system(size: 44)).foregroundStyle(.secondary)
                      Text("This note is locked.").font(.system(size: 20, weight: .semibold))
                      Text("Password hint: " + (note.lockedHint ?? "")).font(.system(size: 15)).foregroundStyle(.secondary)
                      SecureField("Password", text: $attempt)
                          .textFieldStyle(.roundedBorder)
                          .textInputAutocapitalization(.never)
                          .autocorrectionDisabled()
                          .frame(maxWidth: 260)
                          .offset(x: sin(shake * .pi * 4) * 8)
                          .onSubmit(tryUnlock)
                      Button("View Note", action: tryUnlock)
                          .buttonStyle(.borderedProminent)
                          .tint(.yellow)
                          .foregroundStyle(.black)
                  }
                  .padding(.top, 80)
                  .frame(maxWidth: .infinity)
              }

              var body: some View {
                  ScrollView {
                      if locked {
                          lockView
                      } else {
                          VStack(alignment: .leading, spacing: 0) {
                              let lines = note.body.components(separatedBy: "\n")
                              Text(lines.first ?? "").font(.system(size: 28, weight: .bold)).padding(.bottom, 10)
                              Text(lines.dropFirst().joined(separator: "\n").trimmingCharacters(in: .newlines))
                                  .font(.system(size: 17))
                                  .lineSpacing(4)
                                  .textSelection(.enabled)
                          }
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .padding(.horizontal, 20)
                          .padding(.top, 8)
                          .transition(.opacity)
                      }
                  }
                  .navigationBarTitleDisplayMode(.inline)
                  .tint(.yellow)
              }
          }

          // MARK: Phone (voicemail)

          struct PhoneApp: View {
              @EnvironmentObject var nav: PhoneNav
              @State private var playing: String? = nil
              @State private var progress: Double = 0
              @State private var callFailed = false
              @AppStorage("vm.heard") private var heard = ""

              func play(_ v: Voicemail) {
                  if playing == v.id { playing = nil; return }
                  playing = v.id
                  progress = 0
                  heard += "|" + v.id
                  withAnimation(.linear(duration: Double(v.seconds))) { progress = 1 }
                  let id = v.id
                  DispatchQueue.main.asyncAfter(deadline: .now() + Double(v.seconds)) {
                      if playing == id { playing = nil }
                  }
              }

              func cell(_ v: Voicemail) -> some View {
                  VStack(alignment: .leading, spacing: 8) {
                      HStack {
                          if !heard.contains(v.id) { Circle().fill(imBlue).frame(width: 9, height: 9) }
                          VStack(alignment: .leading, spacing: 1) {
                              Text(v.from).font(.system(size: 17, weight: .semibold))
                              Text(v.date.listLabel() + "  ·  0:" + String(format: "%02d", v.seconds))
                                  .font(.system(size: 14)).foregroundStyle(.secondary)
                          }
                          Spacer()
                          Button { play(v) } label: {
                              Image(systemName: playing == v.id ? "pause.circle.fill" : "play.circle.fill")
                                  .font(.system(size: 34))
                                  .foregroundStyle(imBlue)
                                  .contentTransition(.symbolEffect(.replace))
                          }
                          .buttonStyle(.plain)
                      }
                      if playing == v.id {
                          ProgressView(value: progress).tint(imBlue)
                              .transition(.opacity)
                      }
                      Text(v.transcript)
                          .font(.system(size: 15))
                          .italic(v.from == "Unknown")
                          .foregroundStyle(.secondary)
                      Button { callFailed = true } label: {
                          Label("Call Back", systemImage: "phone.fill").font(.system(size: 14, weight: .medium))
                      }
                      .buttonStyle(.bordered)
                      .tint(.green)
                  }
                  .padding(.vertical, 6)
                  .animation(.easeInOut(duration: 0.2), value: playing)
              }

              var body: some View {
                  NavigationStack {
                      List {
                          Section {
