              let scale: CGFloat

              var body: some View {
                  Circle()
                      .fill(Palette.dot)
                      .frame(width: 9 * scale, height: 9 * scale)
                      .opacity(0.35 + 0.65 * level)
                      .scaleEffect(0.9 + 0.12 * level)
              }
