          import SwiftUI
          import UIKit
          import AudioToolbox

          // MARK: colours

          extension Color {
              init(hex: UInt32) {
                  self.init(red: Double((hex >> 16) & 0xFF) / 255,
                            green: Double((hex >> 8) & 0xFF) / 255,
                            blue: Double(hex & 0xFF) / 255)
              }

              static func dynamic(light: UInt32, dark: UInt32) -> Color {
                  Color(UIColor { tc in
                      let h = tc.userInterfaceStyle == .dark ? dark : light
                      return UIColor(red: CGFloat((h >> 16) & 0xFF) / 255,
                                     green: CGFloat((h >> 8) & 0xFF) / 255,
                                     blue: CGFloat(h & 0xFF) / 255, alpha: 1)
                  })
              }
          }

          enum Palette {
              static let blue = Color.dynamic(light: 0x007AFF, dark: 0x0A84FF)
              static let gray = Color.dynamic(light: 0xE9E9EB, dark: 0x262628)
              static let dot = Color.dynamic(light: 0x8E8E93, dark: 0x98989F)
          }

          let imBlue = Palette.blue

          enum Sound {
              static var on: Bool { UserDefaults.standard.object(forKey: "sounds") as? Bool ?? true }
              static func sent() { if on { AudioServicesPlaySystemSound(1004) } }
              static func received() { if on { AudioServicesPlaySystemSound(1003) } }
          }

          func ago(_ minutes: Int) -> Date {
              Date().addingTimeInterval(-Double(minutes) * 60)
          }

          extension Date {
              func fmt(_ f: String) -> String {
                  let d = DateFormatter()
                  d.dateFormat = f
                  return d.string(from: self)
              }

              var time: String { fmt("h:mm a") }

              func listLabel() -> String {
                  let cal = Calendar.current
                  if cal.isDateInToday(self) { return fmt("h:mm a") }
                  if cal.isDateInYesterday(self) { return "Yesterday" }
                  let days = cal.dateComponents([.day], from: self, to: Date()).day ?? 99
                  if days < 7 { return fmt("EEEE") }
                  return fmt("M/d/yy")
              }

              func headerText() -> Text {
                  let cal = Calendar.current
                  let day: String
                  if cal.isDateInToday(self) { day = "Today" }
                  else if cal.isDateInYesterday(self) { day = "Yesterday" }
                  else if (cal.dateComponents([.day], from: self, to: Date()).day ?? 99) < 7 { day = fmt("EEEE") }
                  else { day = fmt("EEE, MMM d") }
                  return Text(day).fontWeight(.semibold) + Text(" " + fmt("h:mm a"))
              }
          }

          extension String {
              // Up to three emoji and nothing else: shown large without a bubble, like iMessage.
              var isBigEmoji: Bool {
                  let t = self.filter { !$0.isWhitespace }
                  guard !t.isEmpty, t.count <= 3 else { return false }
                  return t.allSatisfy { ch in
                      let s = ch.unicodeScalars
                      guard let first = s.first else { return false }
                      return first.properties.isEmojiPresentation || (first.properties.isEmoji && s.count > 1)
                  }
              }
          }

          // MARK: models

          enum Tapback: String, CaseIterable, Codable {
              case love, like, dislike, laugh, emphasize, question

              var symbol: String {
                  switch self {
                  case .love: return "heart.fill"
                  case .like: return "hand.thumbsup.fill"
                  case .dislike: return "hand.thumbsdown.fill"
                  case .laugh: return "face.smiling.inverse"
                  case .emphasize: return "exclamationmark.2"
                  case .question: return "questionmark"
                  }
              }

              var label: String {
                  switch self {
                  case .love: return "Heart"
                  case .like: return "Like"
                  case .dislike: return "Dislike"
                  case .laugh: return "Haha"
                  case .emphasize: return "Emphasize"
                  case .question: return "Question"
                  }
              }

              var verb: String {
                  switch self {
                  case .love: return "with a heart"
                  case .like: return "with a thumbs up"
                  case .dislike: return "with a thumbs down"
                  case .laugh: return "with Haha"
                  case .emphasize: return "with !!"
                  case .question: return "with ?"
                  }
              }
          }

          struct ChatMessage: Identifiable, Codable, Equatable {
              var id = UUID()
              var text: String
              var isMe: Bool
              var date: Date
              var fromFinder: Bool? = nil
              var tapback: String? = nil
              var tapbackMine: Bool? = nil
              var failed: Bool? = nil
          }

          struct Conversation: Identifiable, Codable {
              var id = UUID()
              var key: String
              var name: String
              var emoji: String
              var c1: UInt32
              var c2: UInt32
              var pinned = false
              var unread = false
              var live = true
              var messages: [ChatMessage]
              var seenAt: Date? = nil
              var counts: [String: Int] = [:]
              var lastIntent: String? = nil
              var confused = 0
              var created = Date()

              var lastDate: Date { messages.last?.date ?? created }
              var preview: String { messages.last?.text ?? "" }
              var initials: String {
                  let parts = name.split(separator: " ").prefix(2)
                  let s = parts.compactMap { $0.first }.map { String($0) }.joined()
                  return s.isEmpty ? "?" : s.uppercased()
              }
          }

          struct Banner: Identifiable, Equatable {
              let id = UUID()
              let convoID: UUID
              let title: String
              let text: String
              let emoji: String
              let c1: UInt32
              let c2: UInt32

              static func == (a: Banner, b: Banner) -> Bool { a.id == b.id }
          }

          // MARK: store

          @MainActor
          final class ChatStore: ObservableObject {
              @Published var conversations: [Conversation] = [] { didSet { save() } }
              @Published var flags: Set<String> = [] { didSet { save() } }
              @Published var finderName: String? = nil { didSet { save() } }
              @Published var typing: Set<UUID> = []
              @Published var banner: Banner? = nil
              @Published var aiNote: String = ""
              var openChat: UUID? = nil
              private var epoch = 0
              private var pending: [UUID: UUID] = [:]
              private let saveKey = "story.v2"

              static let bubbleSpring = Animation.spring(response: 0.36, dampingFraction: 0.82)

              struct Snapshot: Codable {
                  var conversations: [Conversation]
                  var flags: [String]
                  var finderName: String?
              }

              init() {
                  if let data = UserDefaults.standard.data(forKey: saveKey),
                     let snap = try? JSONDecoder().decode(Snapshot.self, from: data) {
                      conversations = snap.conversations
                      flags = Set(snap.flags)
                      finderName = snap.finderName
                  } else {
                      conversations = Story.initialConversations()
                  }
                  checkTriggers()
              }

              private func save() {
                  let snap = Snapshot(conversations: conversations, flags: Array(flags), finderName: finderName)
                  if let d = try? JSONEncoder().encode(snap) {
                      UserDefaults.standard.set(d, forKey: saveKey)
                  }
              }

              var sorted: [Conversation] { conversations.sorted { $0.lastDate > $1.lastDate } }
              var isEnded: Bool { endingFlag(flags) != nil }

              func idx(_ id: UUID) -> Int? { conversations.firstIndex { $0.id == id } }

              func unreadCount(except id: UUID?) -> Int {
                  conversations.filter { $0.unread && $0.id != id }.count
              }

              func markRead(_ id: UUID) {
                  guard let i = idx(id), conversations[i].unread else { return }
                  conversations[i].unread = false
              }

              func toggleUnread(_ id: UUID) {
                  guard let i = idx(id) else { return }
                  conversations[i].unread.toggle()
              }

              func togglePin(_ id: UUID) {
                  guard let i = idx(id) else { return }
                  withAnimation(.spring(response: 0.4, dampingFraction: 0.85)) { conversations[i].pinned.toggle() }
              }

              func delete(_ id: UUID) {
                  conversations.removeAll { $0.id == id }
              }

              func setTapback(_ t: Tapback?, message mid: UUID, in cid: UUID) {
                  guard let i = idx(cid), let j = conversations[i].messages.firstIndex(where: { $0.id == mid }) else { return }
                  withAnimation(.spring(response: 0.3, dampingFraction: 0.6)) {
                      if let t = t, conversations[i].messages[j].tapback != t.rawValue || conversations[i].messages[j].tapbackMine != true {
                          conversations[i].messages[j].tapback = t.rawValue
                          conversations[i].messages[j].tapbackMine = true
                      } else {
                          conversations[i].messages[j].tapback = nil
                          conversations[i].messages[j].tapbackMine = nil
                      }
                  }
                  UIImpactFeedbackGenerator(style: .light).impactOccurred()
              }

              func reset() {
                  epoch += 1
                  UserDefaults.standard.removeObject(forKey: saveKey)
                  typing = []
                  banner = nil
                  openChat = nil
                  pending = [:]
                  flags = []
                  finderName = nil
                  conversations = Story.initialConversations()
                  checkTriggers()
              }

              // MARK: timing

              static func typeTime(_ s: String) -> Double {
                  let fast = UserDefaults.standard.bool(forKey: "fastReplies")
                  return min(0.7 + Double(s.count) * 0.028, 2.8) * (fast ? 0.4 : 1)
              }

              static func sleep(_ seconds: Double) async {
                  try? await Task.sleep(nanoseconds: UInt64(max(seconds, 0) * 1_000_000_000))
              }

              // MARK: sending

              func send(_ text: String, to cid: UUID) {
                  guard let i = idx(cid) else { return }
                  withAnimation(ChatStore.bubbleSpring) {
                      for k in conversations[i].messages.indices where conversations[i].messages[k].failed == true {
                          conversations[i].messages[k].failed = nil
                      }
                      conversations[i].messages.append(ChatMessage(text: text, isMe: true, date: Date(), fromFinder: true))
                      conversations[i].seenAt = nil
                  }
                  conversations[i].unread = false
                  Sound.sent()
                  if let n = Engine.detectName(text) { finderName = n }

                  // Wait briefly so a burst of texts gets one reply, like a person would.
                  let token = UUID()
                  pending[cid] = token
                  let ep = epoch
                  Task { @MainActor in
                      await ChatStore.sleep(1.4)
                      guard self.epoch == ep, self.pending[cid] == token else { return }
                      await self.reply(to: cid, epoch: ep)
                  }
              }

              func retry(_ cid: UUID) {
                  guard let i = idx(cid) else { return }
                  withAnimation(.easeInOut(duration: 0.2)) {
                      for k in conversations[i].messages.indices where conversations[i].messages[k].failed == true {
                          conversations[i].messages[k].failed = nil
                      }
                  }
                  let token = UUID()
                  pending[cid] = token
                  let ep = epoch
                  Task { @MainActor in
                      await ChatStore.sleep(0.6)
                      guard self.epoch == ep, self.pending[cid] == token else { return }
                      await self.reply(to: cid, epoch: ep)
                  }
              }

              private func checkHill(_ text: String) -> Bool {
                  let n = " " + Engine.normalize(text) + " "
                  if n.contains(" ember and tide ") || n.contains(" ember tide ") { flags.insert("heard_word") }
                  if n.contains(" aldous ") { flags.insert("heard_name") }
                  if flags.contains("heard_word") && flags.contains("heard_name") && !flags.contains("hill_open") && !isEnded {
                      flags.insert("hill_open")
                      return true
                  }
                  return false
              }

              private func reply(to cid: UUID, epoch ep: Int) async {
                  guard let i = idx(cid) else { return }
                  let key = conversations[i].key
                  guard let role = Roles.all[key] else { return }
                  let recent = conversations[i].messages.reversed().prefix { $0.isMe }.reversed().map { $0.text }
                  let joined = recent.joined(separator: "\n")
                  if joined.isEmpty { return }

                  // They have read it.
                  await ChatStore.sleep(0.4)
                  guard epoch == ep, let i2 = idx(cid) else { return }
                  withAnimation(.easeInOut(duration: 0.2)) { conversations[i2].seenAt = Date() }

                  var justHappened: [String] = []
                  if key == "corvin" && checkHill(joined) { justHappened.append("hill_open") }

                  var parts: [String] = []
                  var newFlags: Set<String> = []
                  var tapback: Tapback? = nil
                  var usedAI = false

                  if AIConfig.ready {
                      let phrase = Director.phraseEvents(role: role, text: joined, flags: flags)
                      for p in phrase { flags.insert(p); justHappened.append(p) }
                      withAnimation(ChatStore.bubbleSpring) { _ = typing.insert(cid) }
                      guard let i3 = idx(cid) else { return }
                      let req = Director.request(role: role, convo: conversations[i3], flags: flags,
                                                 finderName: finderName, justHappened: justHappened)
                      let raw = await LLM.completeWithRetry(req)
                      guard epoch == ep else { return }
                      if let raw = raw {
                          let parsed = Director.parse(raw)
                          if !parsed.parts.isEmpty {
                              usedAI = true
                              aiNote = ""
                              parts = parsed.parts
                              tapback = parsed.tapback
                              if finderName == nil, let n = parsed.name { finderName = n }
                              newFlags.formUnion(Director.validate(role: role, events: parsed.events, flags: flags))
                              let said = parts.joined(separator: " ").lowercased()
                              if key == "delphine" && flags.contains("delphine_owes") && said.contains("aldous") { newFlags.insert("has_name") }
                              if key == "pip" && !flags.contains("knows_missing") && (said.contains("hollow hill") || said.contains("vanish")) { newFlags.insert("knows_missing") }
                          }
                      }
                      if !usedAI {
                          // Like a real failed iMessage: mark it Not Delivered and let them tap to retry.
                          aiNote = LLM.lastError
                          for p in phrase { flags.remove(p) }
                          if justHappened.contains("hill_open") { flags.remove("hill_open") }
                          if let j = idx(cid) {
                              withAnimation(.easeInOut(duration: 0.25)) {
                                  typing.remove(cid)
                                  conversations[j].seenAt = nil
                                  var k = conversations[j].messages.count - 1
                                  while k >= 0 && conversations[j].messages[k].isMe {
                                      conversations[j].messages[k].failed = true
                                      k -= 1
                                  }
                              }
                          }
                          UINotificationFeedbackGenerator().notificationOccurred(.error)
                          return
                      }
                  }

                  if !usedAI, let persona = Story.personas[key], let j = idx(cid) {
                      let c = conversations[j]
                      let res = Engine.respond(persona: persona, text: joined, counts: c.counts, lastIntent: c.lastIntent,
                                               confused: c.confused, flags: flags, finderName: finderName)
                      if res.intentID == "epilogue" {
                          conversations[j].counts["epilogue", default: 0] += 1
                      } else if res.matched, let iid = res.intentID {
                          conversations[j].counts[iid, default: 0] += 1
                          conversations[j].lastIntent = iid
                          conversations[j].confused = 0
                      } else {
                          conversations[j].confused += 1
                          conversations[j].lastIntent = nil
                      }
                      parts = res.parts
                      newFlags.formUnion(res.sets)
                      if justHappened.contains("hill_open") {
                          let name = finderName ?? "little thief"
                          parts = Story.hillOpenLines.map { $0.replacingOccurrences(of: "{name}", with: name) }
                      }
                  }

                  flags.formUnion(newFlags)
                  if parts.isEmpty {
                      typing.remove(cid)
                      return
                  }
                  if let t = tapback, let j = idx(cid), let last = conversations[j].messages.lastIndex(where: { $0.isMe }) {
                      withAnimation(.spring(response: 0.3, dampingFraction: 0.6)) {
                          conversations[j].messages[last].tapback = t.rawValue
                          conversations[j].messages[last].tapbackMine = false
                      }
                      await ChatStore.sleep(0.5)
                  }
                  await deliver(parts, to: cid, epoch: ep, warm: usedAI)
                  checkTriggers()
              }

              // Types each text out, then swaps the typing bubble for the message in one animation.
              private func deliver(_ parts: [String], to cid: UUID, epoch ep: Int, warm: Bool) async {
                  if !warm { await ChatStore.sleep(0.5) }
                  for (n, part) in parts.enumerated() {
                      guard epoch == ep, idx(cid) != nil else { typing.remove(cid); return }
                      if !typing.contains(cid) {
                          withAnimation(ChatStore.bubbleSpring) { _ = typing.insert(cid) }
                      }
                      let t = (n == 0 && warm) ? min(ChatStore.typeTime(part) * 0.45, 1.3) : ChatStore.typeTime(part)
                      await ChatStore.sleep(t)
                      guard epoch == ep else { return }
                      appendIncoming(part, to: cid)
                      await ChatStore.sleep(0.45)
                  }
              }

              private func appendIncoming(_ text: String, to cid: UUID) {
                  guard let i = idx(cid) else { return }
                  withAnimation(ChatStore.bubbleSpring) {
                      typing.remove(cid)
                      conversations[i].messages.append(ChatMessage(text: text, isMe: false, date: Date()))
                  }
                  Sound.received()
                  if openChat == cid { return }
                  conversations[i].unread = true
                  let c = conversations[i]
                  let b = Banner(convoID: cid, title: c.name, text: text, emoji: c.emoji, c1: c.c1, c2: c.c2)
                  banner = b
                  UIImpactFeedbackGenerator(style: .soft).impactOccurred()
                  Task { @MainActor in
                      await ChatStore.sleep(4.5)
                      if self.banner == b { self.banner = nil }
                  }
              }

              private func ensureConversation(_ key: String) -> UUID? {
                  if let c = conversations.first(where: { $0.key == key }) { return c.id }
                  guard let r = Roles.all[key] else { return nil }
                  let c = Conversation(key: r.key, name: r.name, emoji: r.emoji, c1: r.c1, c2: r.c2, messages: [])
                  conversations.append(c)
                  return c.id
              }

              // MARK: story triggers

              private func schedule(_ ping: Ping) {
                  let ep = epoch
                  Task { @MainActor in
                      await ChatStore.sleep(ping.delay)
                      guard self.epoch == ep, let cid = self.ensureConversation(ping.to) else { return }
                      if let r = ping.rename, let i = self.idx(cid) {
                          self.conversations[i].name = r
                          self.conversations[i].emoji = "\u{1F319}"
                          self.conversations[i].c1 = 0x5856D6
                          self.conversations[i].c2 = 0x1C1C3A
                      }
                      let name = self.finderName ?? "stranger"
                      let raw = ping.text.replacingOccurrences(of: "{name}", with: name)
                      for part in raw.components(separatedBy: "||") {
                          guard self.epoch == ep, self.idx(cid) != nil else { return }
                          withAnimation(ChatStore.bubbleSpring) { _ = self.typing.insert(cid) }
                          await ChatStore.sleep(ChatStore.typeTime(part))
                          guard self.epoch == ep else { return }
                          self.appendIncoming(part, to: cid)
                          await ChatStore.sleep(0.5)
                      }
                      if !ping.sets.isEmpty {
                          self.flags.formUnion(ping.sets)
                          self.checkTriggers()
                      }
                  }
              }

              func checkTriggers() {
                  for t in Story.triggers {
                      let fired = "fired_" + t.id
                      if flags.contains(fired) { continue }
                      if !t.when.allSatisfy({ flags.contains($0) }) { continue }
                      if !t.any.isEmpty && !t.any.contains(where: { flags.contains($0) }) { continue }
