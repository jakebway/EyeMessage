          cat > project.yml <<'EOF'
          name: Messages
          options:
            bundleIdPrefix: com.example
          targets:
            Messages:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources: [App]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.messagesclone
                  PRODUCT_NAME: EyeMessage
                  SWIFT_VERSION: "5.0"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_CFBundleDisplayName: EyeMessage
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
                  MARKETING_VERSION: "3.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

      - name: Use the newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Add app icon
        run: |
          # The icon lives in the repo as its own file (workflow files are capped at 500 KB).
          ICON=$(ls EyeMessage-icon.png icon.png 2>/dev/null | head -1)
          if [ -z "$ICON" ]; then
            echo "::error::Upload EyeMessage-icon.png to the top level of the repo, then run again."
            exit 1
          fi
          cp "$ICON" App/Assets.xcassets/AppIcon.appiconset/icon.png
          cp "$ICON" App/Assets.xcassets/EyeIcon.imageset/eye.png

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Messages.xcodeproj \
            -scheme Messages \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { echo "::group::Compile errors"; grep -E "error:" build.log | sort -u | head -60; echo "::endgroup::"; grep -E "error:" build.log | sort -u | head -15 | while read -r l; do echo "::error::$l"; done; exit 1; }
          tail -5 build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EyeMessage.app Payload/
          zip -qr EyeMessage.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: EyeMessage
          path: EyeMessage.ipa
