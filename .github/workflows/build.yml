                  base = p.base
                  model = p.model
              }

              func runTest() {
                  testing = true
                  testResult = ""
                  Task { @MainActor in
                      let req = LLMRequest(system: "You are Pip, a sarcastic fox spirit. Reply with one short lowercase text message.",
                                           messages: [["role": "user", "content": "hello? is anyone there?"]])
                      let out = await LLM.complete(req, maxTokens: 400)
                      testing = false
                      if let out = out {
                          testOK = true
                          testResult = "Connected. Pip says: " + String(Director.parse(out).parts.first?.prefix(120) ?? "")
                      } else {
                          testOK = false
                          testResult = LLM.lastError.isEmpty ? "No reply." : LLM.lastError
                      }
                  }
              }

              func progressRow(_ title: String, _ done: Bool) -> some View {
                  HStack {
                      Image(systemName: done ? "checkmark.circle.fill" : "circle")
