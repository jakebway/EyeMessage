          import SwiftUI

          struct SettingsView: View {
              @EnvironmentObject var store: ChatStore
              @Environment(\.dismiss) private var dismiss
              var onReset: () -> Void

              @AppStorage("ai.enabled") private var enabled = false
              @AppStorage("ai.provider") private var provider = "groq"
              @AppStorage("ai.base") private var base = "https://api.groq.com/openai/v1"
              @AppStorage("ai.model") private var model = "llama-3.3-70b-versatile"
              @AppStorage("ai.key") private var key = ""

              @State private var testing = false
              @State private var testResult = ""
              @State private var testOK = false
              @State private var confirmReset = false

              func applyPreset(_ id: String) {
                  guard let p = AIPreset.all.first(where: { $0.id == id }), id != "custom" else { return }
                  base = p.base
                  model = p.model
              }

              func runTest() {
                  testing = true
                  testResult = ""
                  Task { @MainActor in
                      let req = LLMRequest(system: "This is a connection test. Reply with exactly one word: ready",
                                           messages: [["role": "user", "content": "ping"]])
                      let out = await LLM.complete(req, maxTokens: 60)
                      testing = false
                      if let out = out {
                          testOK = true
                          testResult = "Connected. The model replied: " + String(out.prefix(60))
                      } else {
                          testOK = false
                          testResult = LLM.lastError.isEmpty ? "No reply." : LLM.lastError
                      }
                  }
              }

              func progressRow(_ title: String, _ done: Bool) -> some View {
                  HStack {
                      Text(title)
                      Spacer()
                      Image(systemName: done ? "checkmark.circle.fill" : "circle")
                          .foregroundStyle(done ? Color.green : Color.secondary)
                  }
              }

              var ended: Bool {
                  Engine.endFlags.contains { store.flags.contains($0) }
              }

              var body: some View {
                  NavigationStack {
                      Form {
                          Section {
                              Toggle("Live AI replies", isOn: $enabled)
                              Picker("Provider", selection: $provider) {
                                  ForEach(AIPreset.all) { p in
                                      Text(p.label).tag(p.id)
                                  }
                              }
                              .onChange(of: provider) { p in applyPreset(p) }
                              SecureField("API key", text: $key)
                                  .textInputAutocapitalization(.never)
                                  .autocorrectionDisabled()
                              TextField("Base URL", text: $base)
                                  .textInputAutocapitalization(.never)
                                  .autocorrectionDisabled()
                                  .keyboardType(.URL)
                              TextField("Model", text: $model)
                                  .textInputAutocapitalization(.never)
                                  .autocorrectionDisabled()
                              Button {
                                  runTest()
                              } label: {
                                  HStack {
                                      Text("Test connection")
                                      if testing {
                                          Spacer()
                                          ProgressView()
                                      }
                                  }
                              }
                              .disabled(key.trimmingCharacters(in: .whitespaces).isEmpty || testing)
                              if !testResult.isEmpty {
                                  Text(testResult)
                                      .font(.footnote)
                                      .foregroundStyle(testOK ? Color.green : Color.red)
                              }
                          } header: {
                              Text("Character AI")
                          } footer: {
                              Text("Each character answers in their own voice using a free-tier model. Get a free key from Groq (console.groq.com), Google AI Studio (aistudio.google.com) or OpenRouter (openrouter.ai). Your key stays on this phone and is only sent to the provider you choose. The plot itself always runs on the device, and if the AI is off, offline or rate-limited, the built-in engine answers instead.")
                          }

                          Section("Story") {
                              HStack {
                                  Text("Your name")
                                  TextField("Unknown", text: Binding(
                                      get: { store.finderName ?? "" },
                                      set: { store.finderName = $0.isEmpty ? nil : $0 }
                                  ))
                                  .multilineTextAlignment(.trailing)
                              }
                              Button("Reset Story", role: .destructive) { confirmReset = true }
                          }

                          Section("Progress") {
                              progressRow("Told Pip you found the phone", store.flags.contains("told_pip"))
                              progressRow("Learned what happened to Ilsabet", store.flags.contains("knows_missing"))
                              progressRow("The Word", store.flags.contains("has_word"))
                              progressRow("The Name", store.flags.contains("has_name"))
                              progressRow("The Hollow Hill opened", store.flags.contains("hill_open"))
                              progressRow("Story ended", ended)
                          }
                      }
                      .navigationTitle("Settings")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Done") { dismiss() }
                          }
                      }
                      .confirmationDialog("Reset the story?", isPresented: $confirmReset, titleVisibility: .visible) {
                          Button("Reset", role: .destructive) {
                              onReset()
                              dismiss()
                          }
                          Button("Cancel", role: .cancel) {}
                      } message: {
                          Text("All conversations go back to how the phone was found.")
                      }
                  }
              }
          }
