                      Ping(to: "ilsabet", text: "So it chose you. I thought it might. It likes people who have no idea what they're doing.||I'm out. Tired, alive, annoyed. The shop is yours if you want it. The sign is fine. I wouldn't change a word.||Welcome to the work. 🌙", delay: 20, rename: "Ilsabet Vesper")
                  ]),
