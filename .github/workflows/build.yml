      - name: Collect this run's photos
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: photos
          path: photos

      - name: Bake photos into the app
        env:
          PHOTO_DRAW: "0"
        run: python3 scripts/genphotos.py

      - name: Keep the music between builds
        uses: actions/cache@v4
        with:
          path: music-cache
          key: music-${{ hashFiles('App/Resources/music.json') }}
          restore-keys: music-

      - name: Fetch Ilsabet's music (free, openly licensed)
        continue-on-error: true
        run: |
          # Only needed once, to turn the one Ogg track into AAC. Cached after that.
          if [ ! -f music-cache/magic_actions.m4a ] && ! command -v ffmpeg >/dev/null; then brew install ffmpeg >/dev/null 2>&1 || true; fi
          python3 scripts/getmusic.py

      - name: Build in your keys, locked with your setup word
        env:
          SETUP_WORD: ${{ secrets.SETUP_WORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 scripts/setuppack.py

      - name: Use the newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Add app icon
        run: |
          # The icon lives in the repo as its own file (workflow files are capped at 500 KB).
          ICON=$(ls EyeMessage-icon.png icon.png 2>/dev/null | head -1)
          if [ -z "$ICON" ]; then
            echo "::error::Upload EyeMessage-icon.png to the top level of the repo, then run again."
            exit 1
          fi
          cp "$ICON" App/Assets.xcassets/AppIcon.appiconset/icon.png
          cp "$ICON" App/Assets.xcassets/EyeIcon.imageset/eye.png

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          mkdir -p Support
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Messages.xcodeproj \
            -scheme Messages \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { echo "::group::Compile errors"; grep -E "error:" build.log | sort -u | head -60; echo "::endgroup::"; grep -E "error:" build.log | sort -u | head -15 | while read -r l; do echo "::error::$l"; done; exit 1; }
          tail -5 build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EyeMessage.app Payload/
          zip -qr EyeMessage.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: EyeMessage
          path: EyeMessage.ipa
