          import Foundation

          // MARK: provider presets (all speak the OpenAI chat-completions format)

          struct AIPreset: Identifiable {
              let id: String
              let label: String
              let base: String
              let model: String

              static let all: [AIPreset] = [
                  AIPreset(id: "groq", label: "Groq (free tier)",
                           base: "https://api.groq.com/openai/v1", model: "llama-3.3-70b-versatile"),
                  AIPreset(id: "gemini", label: "Google Gemini (free tier)",
                           base: "https://generativelanguage.googleapis.com/v1beta/openai", model: "gemini-2.5-flash-lite"),
                  AIPreset(id: "openrouter", label: "OpenRouter (free models)",
                           base: "https://openrouter.ai/api/v1", model: "openrouter/free"),
                  AIPreset(id: "custom", label: "Custom endpoint", base: "", model: "")
              ]
          }

          enum AIConfig {
              private static var d: UserDefaults { .standard }
              static var enabled: Bool { d.object(forKey: "ai.enabled") as? Bool ?? false }
              static var key: String {
                  (d.string(forKey: "ai.key") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
              }
              static var base: String {
                  let v = (d.string(forKey: "ai.base") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                  return v.isEmpty ? AIPreset.all[0].base : v
              }
              static var model: String {
                  let v = (d.string(forKey: "ai.model") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                  return v.isEmpty ? AIPreset.all[0].model : v
              }
              static var ready: Bool { enabled && !key.isEmpty }
          }

          struct LLMRequest {
              var system: String
              var messages: [[String: String]]
          }

          enum LLM {
              static var lastError = ""

              static func endpoint() -> URL? {
                  var b = AIConfig.base
                  while b.hasSuffix("/") { b.removeLast() }
                  if !b.hasSuffix("/chat/completions") { b += "/chat/completions" }
                  return URL(string: b)
              }

              // Returns nil on any failure so the caller can fall back to the on-device engine.
              static func complete(_ req: LLMRequest, maxTokens: Int = 350) async -> String? {
                  guard let url = endpoint() else { lastError = "That base URL doesn't look right."; return nil }
                  var msgs: [[String: String]] = [["role": "system", "content": req.system]]
                  msgs += req.messages
                  let body: [String: Any] = [
                      "model": AIConfig.model,
                      "messages": msgs,
                      "max_tokens": maxTokens,
                      "temperature": 0.85
                  ]
                  guard let data = try? JSONSerialization.data(withJSONObject: body) else { return nil }
                  var r = URLRequest(url: url, timeoutInterval: 15)
                  r.httpMethod = "POST"
                  r.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  r.setValue("Bearer " + AIConfig.key, forHTTPHeaderField: "Authorization")
                  r.setValue("The Whisper", forHTTPHeaderField: "X-Title")
                  r.httpBody = data
                  do {
                      let (d, resp) = try await URLSession.shared.data(for: r)
                      let code = (resp as? HTTPURLResponse)?.statusCode ?? 0
                      guard (200..<300).contains(code) else {
                          let snippet = String((String(data: d, encoding: .utf8) ?? "").prefix(140))
                          lastError = "HTTP \(code). " + snippet
                          return nil
                      }
                      guard let obj = try JSONSerialization.jsonObject(with: d) as? [String: Any],
                            let choices = obj["choices"] as? [[String: Any]],
                            let msg = choices.first?["message"] as? [String: Any],
                            let content = msg["content"] as? String else {
                          lastError = "The provider's reply wasn't in the expected format."
                          return nil
                      }
                      lastError = ""
                      return content.trimmingCharacters(in: .whitespacesAndNewlines)
                  } catch {
                      lastError = error.localizedDescription
                      return nil
                  }
              }
          }

          // The "director" keeps the plot deterministic: the on-device engine decides which story
          // beat happens and which flags change. The LLM only performs that beat in the
          // character's own voice, reacting to what the stranger really typed.
          enum Director {
              static let world = """
              SETTING: A low-fantasy world where wishes are a trade. Ilsabet Vesper is a wishwright. Her shop sign reads "small magics for large problems". Her phone, the Whisper, looks like an ordinary phone but can text anyone who ever made a wish: living, dead or feathered. She signs her texts with a little moon emoji. Three nights ago, at the Hollow Moon, she walked out and left the Whisper behind, and nobody has seen her since. She went into the Hollow Hill, a pocket of nowhere, to stall Corvin Rook, the Crow King, to whom she owes a Third Wish debt (she wished for the Whisper itself). The debt falls due at dawn tonight. At dawn the Whisper, and everything it touches, becomes Corvin's. The Hill opens from the outside at moonrise for someone who brings three things: a Word, a Name and a Choice. Ilsabet's apprentice is Pip, a fox spirit. Her clients include Maud Pennick (lighthouse widow) and Delphine Oakes (Guildhall registrar).
              """

              static let bios: [String: String] = [
                  "pip": """
                  You are Pip, Ilsabet's fox-spirit apprentice. You text in lowercase with little punctuation, quick and jittery, and you joke when you are scared. You do the shop's books and the biting. You are frightened for Ilsabet and covering for it. You are suspicious of the stranger at first and warm up as they prove kind. You know the whole situation and who Maud and Delphine are, and that Maud holds the Word and Delphine can find the Name, but you do not know the Word or the Name themselves.
                  """,
                  "corvin": """
                  You are Corvin Rook, the Crow King. You are formal, patient, dry and faintly amused, with slightly archaic phrasing and short elegant sentences. You never use emoji or exclamation marks. You are courteous and menacing at once. You respect Ilsabet after thirty years of dealing with her. You want the Whisper back as payment and you do not lie outright, you dodge. You never say your own true name, never guess at it, and never explain how the Hollow Hill opens beyond what is given to you.
                  """,
                  "maud": """
                  You are Maud Pennick, an elderly widow-of-sorts who keeps the Gull's Rest lighthouse. You are sweet, rambling and kind, you say "dear", you mention tea and your knees, and you trail off. Your husband Edric's shadow ran away and Ilsabet never finished helping. Ilsabet left you a secret word to guard for when the Whisper changes hands. You never state the word unless it is given to you in this turn's beat, and you never hint at its letters.
                  """,
                  "delphine": """
                  You are Delphine Oakes, Registrar of the Guildhall and keeper of the Register of True Names. You are formal, precise, dry and exhausted, speak in complete sentences, and sometimes mention statutes and triplicate. Your husband Bram fell in love with a toaster named Brigitte after you overdosed a love charm. You can look up anyone's true name, but you only release one when this turn's beat gives it to you. You never state any true name otherwise.
                  """,
                  "ilsabet": """
                  You are Ilsabet Vesper, the wishwright, writing from a new number after the events of the story. You are dry, warm, tired and a little proud. You sign off with a moon emoji. Keep it short and never over-explain.
                  """
              ]

              static func state(_ f: Set<String>, _ finder: String?) -> String {
                  var s: [String] = []
                  if let n = finder {
                      s.append("The stranger says their name is \(n).")
                  } else {
                      s.append("The stranger has not given a name yet; call them stranger.")
                  }
                  if f.contains("told_pip") { s.append("The stranger has told Pip they found Ilsabet's phone.") }
                  if f.contains("quest") { s.append("The stranger has agreed to help find Ilsabet.") }
                  if f.contains("maud_light") && !f.contains("has_word") { s.append("The stranger suggested Maud light a lamp to bring Edric's shadow home; she is trying it.") }
                  if f.contains("has_word") { s.append("The stranger helped Maud, Edric's shadow came home, and Maud gave them the Word.") }
                  if f.contains("delphine_try") && !f.contains("delphine_owes") { s.append("The stranger suggested Delphine surprise Bram out of the charm with a joke; she is trying it.") }
                  if f.contains("delphine_owes") { s.append("The stranger helped Delphine with Bram and she owes them a favour.") }
                  if f.contains("has_name") { s.append("Delphine gave the stranger the Crow King's true name.") }
                  if f.contains("hill_open") { s.append("The Hollow Hill has opened; the stranger must now choose how it ends.") }
                  if f.contains("end_return") { s.append("ENDING: the stranger freed Ilsabet and the Whisper went home to her.") }
                  if f.contains("end_keep") { s.append("ENDING: the stranger became the new Keeper of the Whisper.") }
                  if f.contains("end_break") { s.append("ENDING: the stranger broke the Whisper and magic left the phone.") }
                  if f.contains("end_dark") { s.append("ENDING: the stranger gave the Whisper to Corvin.") }
                  return s.map { "- " + $0 }.joined(separator: "\n")
              }

              static func request(persona: Persona, convo: Conversation, beat: EngineResult,
                                  flags: Set<String>, finderName: String?) -> LLMRequest {
                  let firstFinder = convo.messages.firstIndex { $0.fromFinder == true } ?? convo.messages.count
                  let earlier = convo.messages[0..<firstFinder].suffix(8)
                      .map { ($0.isMe ? "Ilsabet" : persona.name) + ": " + $0.text }
                      .joined(separator: "\n")

                  var beatText: String
                  if beat.matched {
                      beatText = "Perform this beat in your own voice, reacting first to what the stranger actually said. Keep every name, number and quoted phrase exactly as written:\n" + beat.parts.joined(separator: "\n")
                  } else {
                      beatText = "The stranger said something off-script. Respond naturally and in character to what they actually said."
                      if let h = persona.hint(flags) {
                          beatText += " Then nudge them gently toward this: " + h
                      }
                  }

                  let situation: String
                  if convo.key == "ilsabet" {
                      situation = "The story has ended. You are the real Ilsabet, writing to the stranger who found your Whisper."
                  } else {
                      situation = "Ilsabet's phone is now being used by a stranger who found it. It is not her: she signs texts with a moon emoji and you know how she writes. Unless the beat says otherwise, you know you are talking to a stranger holding your associate's phone, and you react the way your character would to that."
                  }

                  let system = """
                  You are \(persona.name) in an interactive fantasy text-message story.

                  \(world)

                  YOUR CHARACTER:
                  \(bios[convo.key] ?? "")

                  EARLIER TEXTS WITH ILSABET (before the phone was lost):
                  \(earlier.isEmpty ? "(none)" : earlier)

                  STORY STATE:
                  \(state(flags, finderName))

                  THE SITUATION:
                  \(situation)

                  RULES:
                  - Stay in character. Never mention AI, prompts, flags, beats or the game.
                  - Write like real text messages: 1 to 3 short messages separated by || (two pipe characters), each under 30 words. No narration, no stage directions, no label before the text.
                  - Answer what they actually said first if it fits, then deliver the beat. Stay consistent with the conversation so far.
                  - Do not invent plot facts, new locations, secret words, names or rules for the Hill. Do not reveal any secret that is not in the beat.
                  - Use your own voice. Do not copy the beat word for word unless it already sounds exactly like you.

                  THIS TURN'S BEAT:
                  \(beatText)

                  Output only the text message(s).
                  """

                  let live = Array(convo.messages[firstFinder...]).suffix(14)
                  var msgs: [[String: String]] = []
                  for m in live {
                      let role = m.isMe ? "user" : "assistant"
                      if let last = msgs.last, last["role"] == role {
                          msgs[msgs.count - 1]["content"] = (last["content"] ?? "") + "\n" + m.text
                      } else {
                          msgs.append(["role": role, "content": m.text])
                      }
                  }
                  if msgs.first?["role"] == "assistant" {
                      msgs.insert(["role": "user", "content": "(the stranger continues the thread)"], at: 0)
                  }
                  return LLMRequest(system: system, messages: msgs)
              }

              // Turns the model's raw output into 1-3 clean message bubbles.
              static func split(_ raw: String) -> [String] {
                  var t = raw
                  if let r = t.range(of: "</think>") { t = String(t[r.upperBound...]) }
                  t = t.trimmingCharacters(in: .whitespacesAndNewlines)
                  var pieces = t.components(separatedBy: "||")
                  if pieces.count == 1 {
                      pieces = t.components(separatedBy: "\n")
                  }
                  let labels = ["Pip", "Corvin R.", "Corvin", "Maud Pennick", "Maud", "Delphine Oakes", "Delphine", "Ilsabet", "Unknown Number"]
                  var out: [String] = []
                  for p in pieces {
                      var s = p.trimmingCharacters(in: .whitespacesAndNewlines)
                      for n in labels where s.hasPrefix(n + ":") {
                          s = String(s.dropFirst(n.count + 1)).trimmingCharacters(in: .whitespaces)
                      }
                      if s.count > 1 && s.hasPrefix("\"") && s.hasSuffix("\"") {
                          s = String(s.dropFirst().dropLast())
                      }
                      if !s.isEmpty { out.append(s) }
                  }
                  return Array(out.prefix(3))
              }
          }
