      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Messages.xcodeproj \
            -scheme Messages \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { echo "::group::Compile errors"; grep -E "error:" build.log | sort -u | head -60; echo "::endgroup::"; grep -E "error:" build.log | sort -u | head -15 | while read -r l; do echo "::error::$l"; done; exit 1; }
          tail -5 build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/EyeMessage.app Payload/
          zip -qr EyeMessage.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: EyeMessage
          path: EyeMessage.ipa
