name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write app source
        run: |
          mkdir -p App
          cat > App/MessagesApp.swift <<'EOF'
          import SwiftUI

          @main
          struct MessagesApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          EOF
          cat > App/Models.swift <<'EOF'
          import SwiftUI

          let imBlue = Color(red: 0.04, green: 0.52, blue: 1.0)

          func ago(_ minutes: Int) -> Date {
              Date().addingTimeInterval(-Double(minutes) * 60)
          }

          struct ChatMessage: Identifiable {
              let id = UUID()
              var text: String
              var isMe: Bool
              var date: Date
              var sender: String? = nil
          }

          struct Conversation: Identifiable {
              let id = UUID()
              let created = Date()
              var name: String
              var isGroup = false
              var unread = false
              var messages: [ChatMessage]

              var lastDate: Date { messages.last?.date ?? created }
              var preview: String { messages.last?.text ?? "" }
              var initials: String {
                  let parts = name.split(separator: " ").prefix(2)
                  let s = parts.compactMap { $0.first }.map { String($0) }.joined()
                  return s.isEmpty ? "?" : s.uppercased()
              }
          }

          extension Date {
              private func fmt(_ f: String) -> String {
                  let d = DateFormatter()
                  d.dateFormat = f
                  return d.string(from: self)
              }

              func listLabel() -> String {
                  let cal = Calendar.current
                  if cal.isDateInToday(self) { return fmt("h:mm a") }
                  if cal.isDateInYesterday(self) { return "Yesterday" }
                  let days = cal.dateComponents([.day], from: self, to: Date()).day ?? 99
                  if days < 7 { return fmt("EEEE") }
                  return fmt("M/d/yy")
              }

              func headerLabel() -> String {
                  let cal = Calendar.current
                  if cal.isDateInToday(self) { return "Today " + fmt("h:mm a") }
                  if cal.isDateInYesterday(self) { return "Yesterday " + fmt("h:mm a") }
                  return fmt("EEE, MMM d") + " " + fmt("h:mm a")
              }
          }

          final class ChatStore: ObservableObject {
              @Published var conversations: [Conversation] = ChatStore.sample()
              private var spareContacts = ["Alex Rivera", "Jordan Lee", "Taylor Brooks", "Sam Okafor"]

              var sorted: [Conversation] {
                  conversations.sorted { $0.lastDate > $1.lastDate }
              }

              func append(_ msg: ChatMessage, to id: UUID) {
                  guard let i = conversations.firstIndex(where: { $0.id == id }) else { return }
                  conversations[i].messages.append(msg)
              }

              func markRead(_ id: UUID) {
                  guard let i = conversations.firstIndex(where: { $0.id == id }) else { return }
                  if conversations[i].unread { conversations[i].unread = false }
              }

              func delete(_ id: UUID) {
                  conversations.removeAll { $0.id == id }
              }

              func compose() {
                  guard !spareContacts.isEmpty else { return }
                  let name = spareContacts.removeFirst()
                  conversations.append(Conversation(name: name, messages: []))
              }

              private static func m(_ t: String, _ me: Bool, _ min: Int, _ sender: String? = nil) -> ChatMessage {
                  ChatMessage(text: t, isMe: me, date: ago(min), sender: sender)
              }

              static func sample() -> [Conversation] {
                  [
                      Conversation(name: "Mom", messages: [
                          m("Don't forget dinner on Sunday!", false, 1500),
                          m("I won't, what time?", true, 1495),
                          m("6pm. Dad is making his lasagna 🍝", false, 1490),
                          m("Perfect, I'll bring dessert", true, 1488),
                          m("You're the best ❤️", false, 1487),
                          m("Also can you pick up the pie from Whole Foods?", false, 45),
                          m("Sure, I'll grab it after work", true, 40),
                          m("Thank you sweetheart. Drive safe!", false, 38)
                      ]),
                      Conversation(name: "Sarah Chen", unread: true, messages: [
                          m("Did you see the game last night??", false, 300),
                          m("YES. I can't believe that ending", true, 296),
                          m("I literally screamed 😂", false, 295),
                          m("My neighbors probably hate me now", true, 293),
                          m("Are we still on for coffee Saturday?", false, 12),
                          m("Also I found that book you were looking for", false, 11)
                      ]),
                      Conversation(name: "Weekend Trip", isGroup: true, unread: true, messages: [
                          m("Ok so cabin is booked for Fri–Sun 🏕", false, 2900, "Dev Patel"),
                          m("Let's gooo", false, 2895, "Maya Torres"),
                          m("What do I need to bring?", true, 2890),
                          m("Sleeping bag, warm layers, snacks", false, 2885, "Dev Patel"),
                          m("I'll handle the s'mores", false, 2880, "Maya Torres"),
                          m("Who's driving?", true, 190),
                          m("I can take my car, fits 4", false, 185, "Dev Patel"),
                          m("Leaving at 5pm Friday to beat traffic", false, 184, "Dev Patel"),
                          m("Works for me 👍", false, 180, "Maya Torres")
                      ]),
                      Conversation(name: "Dev Patel", messages: [
                          m("Hey, did you get a chance to look at the proposal?", false, 4400),
                          m("Just finished. Left a few comments in the doc", true, 4390),
                          m("Awesome, thanks. Mostly formatting stuff?", false, 4385),
                          m("Yeah, and the budget section needs a second pass", true, 4380),
                          m("On it", false, 4379)
                      ]),
                      Conversation(name: "Pizza Palace", messages: [
                          m("Your order has been received! Estimated delivery: 35 min.", false, 140),
                          m("Your driver is on the way 🍕", false, 115),
                          m("Your order has been delivered. Enjoy!", false, 100)
                      ]),
                      Conversation(name: "Dr. Kim's Office", messages: [
                          m("Reminder: you have an appointment on Thursday at 2:30 PM. Reply C to confirm.", false, 9000),
                          m("C", true, 8990),
                          m("Thanks! See you then.", false, 8989)
                      ]),
                      Conversation(name: "Jake Morrison", messages: [
                          m("Bro are you coming to the thing on Friday", false, 10200),
                          m("What thing", true, 10190),
                          m("The thing!!", false, 10189),
                          m("Oh THE thing. Yeah I'll be there", true, 10185),
                          m("Legend", false, 10184)
                      ]),
                      Conversation(name: "86753", unread: true, messages: [
                          m("Your verification code is 482913. Don't share it with anyone.", false, 25)
                      ])
                  ]
              }
          }
          EOF
          cat > App/Views.swift <<'EOF'
          import SwiftUI

          struct Avatar: View {
              let initials: String
              var size: CGFloat = 50

              var body: some View {
                  ZStack {
                      Circle().fill(LinearGradient(
                          colors: [Color(.systemGray3), Color(.systemGray)],
                          startPoint: .top, endPoint: .bottom))
                      Text(initials)
                          .font(.system(size: size * 0.4, weight: .semibold))
                          .foregroundStyle(.white)
                  }
                  .frame(width: size, height: size)
              }
          }

          struct ContentView: View {
              @StateObject private var store = ChatStore()
              @State private var query = ""

              var filtered: [Conversation] {
                  let all = store.sorted
                  if query.isEmpty { return all }
                  return all.filter {
                      $0.name.localizedCaseInsensitiveContains(query) ||
                      $0.messages.contains { $0.text.localizedCaseInsensitiveContains(query) }
                  }
              }

              var body: some View {
                  NavigationStack {
                      List {
                          ForEach(filtered) { c in
                              NavigationLink {
                                  ChatView(id: c.id)
                              } label: {
                                  ConversationRow(convo: c)
                              }
                              .swipeActions {
                                  Button(role: .destructive) {
                                      store.delete(c.id)
                                  } label: {
                                      Label("Delete", systemImage: "trash")
                                  }
                              }
                          }
                      }
                      .listStyle(.plain)
                      .navigationTitle("Messages")
                      .searchable(text: $query)
                      .toolbar {
                          ToolbarItem(placement: .navigationBarTrailing) {
                              Button { store.compose() } label: {
                                  Image(systemName: "square.and.pencil")
                              }
                          }
                      }
                  }
                  .environmentObject(store)
              }
          }

          struct ConversationRow: View {
              let convo: Conversation

              var body: some View {
                  HStack(spacing: 8) {
                      Circle()
                          .fill(convo.unread ? imBlue : Color.clear)
                          .frame(width: 10, height: 10)
                      Avatar(initials: convo.initials, size: 50)
                      VStack(alignment: .leading, spacing: 2) {
                          HStack {
                              Text(convo.name).fontWeight(.semibold)
                              Spacer()
                              Text(convo.lastDate.listLabel())
                                  .font(.subheadline)
                                  .foregroundStyle(.secondary)
                          }
                          Text(convo.preview.isEmpty ? "No messages" : convo.preview)
                              .font(.subheadline)
                              .foregroundStyle(.secondary)
                              .lineLimit(2)
                      }
                  }
                  .padding(.vertical, 4)
              }
          }

          struct RowModel: Identifiable {
              let id: UUID
              let msg: ChatMessage
              let header: String?
              let sender: String?
              let tight: Bool
              let delivered: Bool
          }

          struct ChatView: View {
              @EnvironmentObject var store: ChatStore
              let id: UUID
              @State private var draft = ""
              @State private var typing = false

              var convo: Conversation {
                  store.conversations.first { $0.id == id } ?? Conversation(name: "", messages: [])
              }

              func rows(for c: Conversation) -> [RowModel] {
                  var out: [RowModel] = []
                  let msgs = c.messages
                  for (i, msg) in msgs.enumerated() {
                      let prev: ChatMessage? = i > 0 ? msgs[i - 1] : nil
                      var header: String? = nil
                      if let p = prev {
                          if msg.date.timeIntervalSince(p.date) > 3600 { header = msg.date.headerLabel() }
                      } else {
                          header = msg.date.headerLabel()
                      }
                      var sender: String? = nil
                      if c.isGroup && !msg.isMe {
                          if let p = prev {
                              if p.isMe || p.sender != msg.sender { sender = msg.sender }
                          } else {
                              sender = msg.sender
                          }
                      }
                      let tight = (prev != nil) && (prev!.isMe == msg.isMe) && header == nil && sender == nil
                      let delivered = msg.isMe && i == msgs.count - 1
                      out.append(RowModel(id: msg.id, msg: msg, header: header, sender: sender, tight: tight, delivered: delivered))
                  }
                  return out
              }

              func scrollDown(_ proxy: ScrollViewProxy) {
                  withAnimation(.easeOut(duration: 0.25)) {
                      proxy.scrollTo("bottom", anchor: .bottom)
                  }
              }

              func send() {
                  let t = draft.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !t.isEmpty else { return }
                  store.append(ChatMessage(text: t, isMe: true, date: Date()), to: id)
                  draft = ""
                  let replySender = convo.messages.last(where: { !$0.isMe })?.sender
                  let replies = ["Haha totally 😂", "Wait really??", "Sounds good!", "Ok see you then 👍",
                                 "No way!", "Omg yes", "Can't wait!", "Let me check and get back to you",
                                 "Lol okay", "That's so funny"]
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.0) { typing = true }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 3.0) {
                      typing = false
                      store.append(ChatMessage(text: replies.randomElement() ?? "ok", isMe: false,
                                               date: Date(), sender: replySender), to: id)
                  }
              }

              var body: some View {
                  let c = convo
                  ScrollViewReader { proxy in
                      ScrollView {
                          LazyVStack(spacing: 2) {
                              ForEach(rows(for: c)) { row in
                                  MessageRow(row: row)
                              }
                              if typing {
                                  HStack {
                                      TypingBubble()
                                      Spacer()
                                  }
                                  .padding(.top, 6)
                              }
                              Color.clear.frame(height: 1).id("bottom")
                          }
                          .padding(.horizontal, 12)
                          .padding(.top, 8)
                      }
                      .onAppear {
                          store.markRead(id)
                          scrollDown(proxy)
                      }
                      .onChange(of: c.messages.count) { _ in scrollDown(proxy) }
                      .onChange(of: typing) { _ in scrollDown(proxy) }
                  }
                  .navigationTitle(c.name)
                  .navigationBarTitleDisplayMode(.inline)
                  .toolbar {
                      ToolbarItem(placement: .principal) {
                          VStack(spacing: 2) {
                              Avatar(initials: c.initials, size: 34)
                              Text(c.name).font(.caption2)
                          }
                      }
                  }
                  .safeAreaInset(edge: .bottom) {
                      HStack(alignment: .bottom, spacing: 8) {
                          Image(systemName: "plus.circle.fill")
                              .font(.title)
                              .foregroundStyle(Color(.systemGray3))
                          HStack(alignment: .bottom) {
                              TextField("iMessage", text: $draft, axis: .vertical)
                                  .lineLimit(1...5)
                              if !draft.isEmpty {
                                  Button(action: send) {
                                      Image(systemName: "arrow.up.circle.fill")
                                          .font(.title2)
                                          .foregroundStyle(imBlue)
                                  }
                              }
                          }
                          .padding(.horizontal, 12)
                          .padding(.vertical, 6)
                          .overlay(
                              RoundedRectangle(cornerRadius: 18, style: .continuous)
                                  .stroke(Color(.systemGray4))
                          )
                      }
                      .padding(.horizontal, 12)
                      .padding(.vertical, 8)
                      .background(.bar)
                  }
              }
          }

          struct MessageRow: View {
              let row: RowModel

              var body: some View {
                  let msg = row.msg
                  VStack(alignment: msg.isMe ? .trailing : .leading, spacing: 2) {
                      if let h = row.header {
                          Text(h)
                              .font(.caption2)
                              .foregroundStyle(.secondary)
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 10)
                      }
                      if let s = row.sender {
                          Text(s)
                              .font(.caption2)
                              .foregroundStyle(.secondary)
                              .padding(.leading, 12)
                              .padding(.top, 6)
                      }
                      HStack {
                          if msg.isMe { Spacer(minLength: 60) }
                          Text(msg.text)
                              .padding(.horizontal, 12)
                              .padding(.vertical, 8)
                              .foregroundStyle(msg.isMe ? Color.white : Color.primary)
                              .background(msg.isMe ? imBlue : Color(.systemGray5))
                              .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))
                          if !msg.isMe { Spacer(minLength: 60) }
                      }
                      .padding(.top, row.tight ? 0 : 4)
                      if row.delivered {
                          Text("Delivered")
                              .font(.caption2)
                              .foregroundStyle(.secondary)
                              .padding(.trailing, 4)
                      }
                  }
                  .frame(maxWidth: .infinity, alignment: msg.isMe ? .trailing : .leading)
              }
          }

          struct TypingBubble: View {
              @State private var on = false

              var body: some View {
                  HStack(spacing: 4) {
                      ForEach(0..<3) { i in
                          Circle()
                              .fill(Color(.systemGray2))
                              .frame(width: 8, height: 8)
                              .opacity(on ? 1 : 0.3)
                              .animation(.easeInOut(duration: 0.6).repeatForever().delay(Double(i) * 0.2), value: on)
                      }
                  }
                  .padding(.horizontal, 14)
                  .padding(.vertical, 12)
                  .background(Color(.systemGray5))
                  .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))
                  .onAppear { on = true }
              }
          }
          EOF
          cat > project.yml <<'EOF'
          name: Messages
          options:
            bundleIdPrefix: com.example
          targets:
            Messages:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources: [App]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.messagesclone
                  PRODUCT_NAME: Messages
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_CFBundleDisplayName: Messages
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1,2"
          EOF

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Messages.xcodeproj \
            -scheme Messages \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Messages.app Payload/
          zip -r Messages.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Messages-ipa
          path: Messages.ipa
