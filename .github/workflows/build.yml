                      CalEvent(id: "moonrise", title: "Moonrise", detail: "The Hill is awake", date: at(daysAgo: 0, hour: 23, minute: 52), color: 0x5856D6),
                      CalEvent(id: "dawn", title: "Dawn: Corvin", detail: "The third dawn. Binding.", date: at(daysAgo: -1, hour: 6, minute: 14), color: 0x1C1C3A)
                  ]
              }

              // The finder's own running notes, written in their voice from what's happened.
              static func journal(_ f: Set<String>, name: String?, secrets: Int, total: Int) -> String {
                  var lines: [String] = ["What I Know", ""]
                  lines.append("I found a phone tonight. It unlocked for me. It isn't mine.")
                  if f.contains("told_pip") {
                      lines.append("It belongs to Ilsabet Vesper, the town witch. Her cat, Pip, is texting it. The cat can talk. I'm choosing not to think about that.")
                  } else {
                      lines.append("Someone called Pip keeps texting it. They seem scared.")
                  }
                  if f.contains("knows_missing") { lines.append("Ilsabet vanished three nights ago. Pip thinks the Crow King, Corvin Rook, took her under the Hollow Hill.") }
                  if f.contains("quest") { lines.append("I said I'd help. Fae have to let go if you say their true name. Dawn is at 6:14.") }
                  if f.contains("bank_verified") { lines.append("The Bank of Ash showed me the contract: say his true name with her voice (this phone) before the third dawn and the bargain breaks.") }
                  if f.contains("maud_rhyme") { lines.append("Maud's lullaby: \"Aldous Rook is at the door.\" Aldous. That's his name.") }
                  else if f.contains("maud_light") { lines.append("Told Maud to light the lighthouse lamp for Edric's shadow. Waiting.") }
                  if f.contains("delphine_owes") && f.contains("has_name") && !f.contains("maud_rhyme") { lines.append("Delphine's Register, folio 41: given name, Aldous.") }
                  else if f.contains("delphine_try") && !f.contains("delphine_owes") { lines.append("Told Delphine to startle Bram out of the love charm.") }
                  if f.contains("tam_song") { lines.append("Paid Old Tam a song. He's holding back the dawn with cloud.") }
                  if f.contains("parcel_burned") { lines.append("Had Moon Mail burn Corvin's feather. It was listening.") }
                  if f.contains("secret_deleted") { lines.append("Found a deleted note. She made the deal to bring Pip back from the dead. Pip doesn't know.") }
                  if f.contains("has_name") && !f.contains("end_free") && !f.contains("end_dark") { lines.append("Next: text Corvin. Say it.") }
                  if f.contains("end_free") { lines.append("I said his name. She's home.") }
                  if f.contains("end_dark") { lines.append("I gave him the phone. I can hear wings.") }
                  lines.append("")
                  lines.append("Secrets found: \(secrets) of \(total)")
                  if let n = name { lines.append("(\(n))") }
                  return lines.joined(separator: "\n")
              }
          }
