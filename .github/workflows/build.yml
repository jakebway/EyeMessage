              // What Corvin says the moment the Word and the Name are both spoken (offline mode).
              static let hillOpenLines = ["...", "There it is. My name in a stranger's mouth. Thirty years since anyone dared.", "The Hill is opening. I can hear the old thing unlocking.", "A bargain is a knot, and knots wish to be cut. Choose, {name}: free Vesper, keep the Whisper, or break it altogether."]
