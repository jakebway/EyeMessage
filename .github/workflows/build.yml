      - name: Recover photos from older builds (one time)
        uses: actions/cache/restore@v4
        with:
          path: photo-cache
          key: murmur-photos-none
          restore-keys: murmur-photos-

      - name: Draw missing photos (Cloudflare Workers AI, free)
        id: draw
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          pip install --quiet pillow || true
          python3 scripts/genphotos.py

      - name: Keep the photos in the repo
        if: steps.draw.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos
          git commit -m "Draw photos [skip ci]" || exit 0
          git pull --rebase --autostash || true
          git push || echo "::warning::Couldn't save the photos to the repo. Turn on Settings > Actions > General > Workflow permissions > Read and write. This build still includes them."

      - name: Hand the photos to the build
        uses: actions/upload-artifact@v4
        with:
          name: photos
          path: photos
          if-no-files-found: ignore
          retention-days: 3

