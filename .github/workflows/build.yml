          cat > App/Engine.swift <<'EOF'
          import Foundation

          struct Ping {
              let to: String
              let text: String
              let delay: Double
              var sets: [String] = []
          }

          struct Trigger {
              let id: String
              let when: [String]
              let pings: [Ping]
          }

          struct Intent {
              let id: String
              var keys: [String]
              var weight: Double = 1
              var needs: [String] = []
              var blocks: [String] = []
              var all: [String] = []
              var requiresLast: String? = nil
              var replies: [String]
              var sets: [String] = []
          }

          func intent(_ id: String, _ keys: [String], _ replies: [String], w: Double = 1,
                      needs: [String] = [], blocks: [String] = [], all: [String] = [],
                      last: String? = nil, sets: [String] = []) -> Intent {
              Intent(id: id, keys: keys, weight: w, needs: needs, blocks: blocks, all: all,
                     requiresLast: last, replies: replies, sets: sets)
          }

          struct Persona {
              let key: String
              let name: String
              let emoji: String
              let c1: UInt32
              let c2: UInt32
              let intents: [Intent]
              let fallbacks: [String]
              let hint: (Set<String>) -> String?
              let endings: [String: [String]]
          }

          struct EngineResult {
              var parts: [String]
              var sets: [String]
              var intentID: String?
              var matched: Bool
              var detectedName: String?
          }

          // A small on-device dialogue model: normalises the text, scores every intent with
          // phrase / keyword / prefix / fuzzy (edit distance) matching, applies story-flag
          // gating and conversational memory, then picks a reply. No network needed.
          enum Engine {
              static let endFlags = ["end_return", "end_keep", "end_break", "end_dark"]

              static let notNames: Set<String> = Set([
                  "a", "an", "the", "not", "just", "here", "so", "very", "sorry", "really", "looking",
                  "trying", "new", "your", "sure", "back", "fine", "good", "okay", "ok", "in", "at", "on",
                  "from", "only", "still", "also", "going", "gonna", "wondering", "curious", "afraid",
                  "scared", "worried", "confused", "lost", "ready", "happy", "glad", "kind", "who", "what",
                  "how", "he", "she", "it", "ilsabet", "vesper", "pip", "corvin", "maud", "delphine",
                  "nobody", "someone", "somebody", "human", "real", "serious", "honest", "alone", "tired",
                  "stuck", "no", "yes", "bored", "nervous", "safe", "pretty", "quite", "now", "then"
              ])

              static func normalize(_ s: String) -> String {
                  let lowered = s.lowercased().replacingOccurrences(of: "&", with: " and ")
                  var out = ""
                  for ch in lowered {
                      if ch == "'" || ch == "\u{2019}" { continue }
                      if ch.isLetter || ch.isNumber { out.append(ch) } else { out.append(" ") }
                  }
                  return out.split(separator: " ").joined(separator: " ")
              }

              static func lev(_ a: String, _ b: String) -> Int {
                  let x = Array(a), y = Array(b)
                  if x.isEmpty { return y.count }
                  if y.isEmpty { return x.count }
                  var prev = Array(0...y.count)
                  for i in 1...x.count {
                      var cur = [Int](repeating: 0, count: y.count + 1)
                      cur[0] = i
                      for j in 1...y.count {
                          let cost = x[i - 1] == y[j - 1] ? 0 : 1
                          cur[j] = min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost)
                      }
                      prev = cur
                  }
                  return prev[y.count]
              }

              static func detectName(_ text: String) -> String? {
                  let words = text.split(whereSeparator: { !($0.isLetter || $0 == "'" || $0 == "\u{2019}") }).map(String.init)
                  let low = words.map { $0.lowercased().replacingOccurrences(of: "'", with: "").replacingOccurrences(of: "\u{2019}", with: "") }
                  func at(_ j: Int) -> String { j >= 0 && j < low.count ? low[j] : "" }
                  func candidate(_ j: Int, needCap: Bool) -> String? {
                      guard j < words.count else { return nil }
                      let l = low[j]
                      if notNames.contains(l) || l.count < 2 || l.count > 14 { return nil }
                      if needCap && !(words[j].first?.isUppercase ?? false) { return nil }
                      return words[j].prefix(1).uppercased() + words[j].dropFirst().lowercased()
                  }
                  for i in 0..<low.count {
                      if at(i) == "my" && at(i + 1) == "name" && at(i + 2) == "is", let n = candidate(i + 3, needCap: false) { return n }
                      if at(i) == "name" && at(i + 1) == "is", let n = candidate(i + 2, needCap: false) { return n }
                      if at(i) == "call" && at(i + 1) == "me", let n = candidate(i + 2, needCap: false) { return n }
                      if at(i) == "im", let n = candidate(i + 1, needCap: true) { return n }
                      if at(i) == "i" && at(i + 1) == "am", let n = candidate(i + 2, needCap: true) { return n }
                  }
                  return nil
              }

              static func matchScore(_ key: String, _ tokens: [String], _ padded: String) -> Double {
                  if key.contains(" ") { return padded.contains(" \(key) ") ? 2.5 : 0 }
                  if tokens.contains(key) { return 1 }
                  if key.count >= 4, tokens.contains(where: { $0.hasPrefix(key) && $0.count - key.count <= 3 }) { return 0.8 }
                  if key.count >= 5, tokens.contains(where: { abs($0.count - key.count) <= 1 && lev($0, key) <= 1 }) { return 0.7 }
                  return 0
              }

              static func makeParts(_ raw: String, name: String, hint: String?) -> [String] {
                  var t = raw.replacingOccurrences(of: "{name}", with: name)
                  t = t.replacingOccurrences(of: "{hint}", with: hint ?? "keep talking to me")
                  return t.components(separatedBy: "||")
                      .map { $0.trimmingCharacters(in: .whitespaces) }
                      .filter { !$0.isEmpty }
              }

              static func respond(persona: Persona, text: String, counts: [String: Int], lastIntent: String?,
                                  confused: Int, flags: Set<String>, finderName: String?) -> EngineResult {
                  let detected = detectName(text)
                  let name = detected ?? finderName ?? "stranger"
                  var norm = normalize(text)
                  var tokens = norm.split(separator: " ").map(String.init)
                  if detected != nil {
                      tokens.append("__name__")
                      norm += " __name__"
                  }
                  let padded = " " + norm + " "
                  let hint = persona.hint(flags)

                  // After the story ends, everyone answers from their epilogue lines.
                  if let end = endFlags.first(where: { flags.contains($0) }),
                     let lines = persona.endings[end], !lines.isEmpty {
                      let n = counts["epilogue"] ?? 0
                      return EngineResult(parts: makeParts(lines[n % lines.count], name: name, hint: hint),
                                          sets: [], intentID: "epilogue", matched: true, detectedName: detected)
                  }

                  var best: Intent? = nil
                  var bestScore = 0.0
                  for it in persona.intents {
                      if !it.needs.allSatisfy({ flags.contains($0) }) { continue }
                      if it.blocks.contains(where: { flags.contains($0) }) { continue }
                      if let l = it.requiresLast, l != lastIntent { continue }
                      if !it.all.allSatisfy({ padded.contains(" \($0) ") }) { continue }
                      var s = 0.0
                      for k in it.keys { s += matchScore(k, tokens, padded) }
                      s *= it.weight
                      if s > bestScore { bestScore = s; best = it }
                  }

                  if let it = best, bestScore >= 0.75 {
                      let n = counts[it.id] ?? 0
                      let idx: Int
                      if n < it.replies.count { idx = n }
                      else if it.replies.count > 1 { idx = Int.random(in: 1..<it.replies.count) }
                      else { idx = 0 }
                      return EngineResult(parts: makeParts(it.replies[idx], name: name, hint: hint),
                                          sets: it.sets, intentID: it.id, matched: true, detectedName: detected)
                  }

                  var parts = [persona.fallbacks[confused % persona.fallbacks.count]]
                  if confused >= 1, let h = hint { parts.append(h) }
                  return EngineResult(parts: parts, sets: [], intentID: nil, matched: false, detectedName: detected)
              }
          }
          EOF
          cat > App/Models.swift <<'EOF'
          import SwiftUI
          import UIKit

          let imBlue = Color(red: 0.04, green: 0.52, blue: 1.0)

          extension Color {
              init(hex: UInt32) {
                  self.init(red: Double((hex >> 16) & 0xFF) / 255,
                            green: Double((hex >> 8) & 0xFF) / 255,
                            blue: Double(hex & 0xFF) / 255)
              }
          }

          func ago(_ minutes: Int) -> Date {
              Date().addingTimeInterval(-Double(minutes) * 60)
          }

          struct ChatMessage: Identifiable, Codable {
              var id = UUID()
              var text: String
              var isMe: Bool
              var date: Date
              var fromFinder: Bool? = nil
          }

          struct Conversation: Identifiable, Codable {
              var id = UUID()
              var key: String
              var name: String
              var emoji: String
              var c1: UInt32
              var c2: UInt32
              var pinned = false
              var unread = false
              var live = false
              var messages: [ChatMessage]
              var counts: [String: Int] = [:]
              var lastIntent: String? = nil
              var confused = 0
              var created = Date()

              var lastDate: Date { messages.last?.date ?? created }
              var preview: String { messages.last?.text ?? "" }
              var initials: String {
                  let parts = name.split(separator: " ").prefix(2)
                  let s = parts.compactMap { $0.first }.map { String($0) }.joined()
                  return s.isEmpty ? "?" : s.uppercased()
              }
          }

          extension Date {
              private func fmt(_ f: String) -> String {
                  let d = DateFormatter()
                  d.dateFormat = f
                  return d.string(from: self)
              }

              func listLabel() -> String {
                  let cal = Calendar.current
                  if cal.isDateInToday(self) { return fmt("h:mm a") }
                  if cal.isDateInYesterday(self) { return "Yesterday" }
                  let days = cal.dateComponents([.day], from: self, to: Date()).day ?? 99
                  if days < 7 { return fmt("EEEE") }
                  return fmt("M/d/yy")
              }

              func headerLabel() -> String {
                  let cal = Calendar.current
                  if cal.isDateInToday(self) { return "Today " + fmt("h:mm a") }
                  if cal.isDateInYesterday(self) { return "Yesterday " + fmt("h:mm a") }
                  return fmt("EEE, MMM d") + " " + fmt("h:mm a")
              }
          }

          struct Banner: Identifiable, Equatable {
              let id = UUID()
              let convoID: UUID
              let title: String
              let text: String
          }

          final class ChatStore: ObservableObject {
              @Published var conversations: [Conversation] = [] { didSet { save() } }
              @Published var flags: Set<String> = [] { didSet { save() } }
              @Published var finderName: String? = nil { didSet { save() } }
              @Published var typing: Set<UUID> = []
              @Published var banner: Banner? = nil
              var openChat: UUID? = nil
              private var epoch = 0
              private let saveKey = "story.v1"

              struct Snapshot: Codable {
                  var conversations: [Conversation]
                  var flags: [String]
                  var finderName: String?
              }

              init() {
                  if let data = UserDefaults.standard.data(forKey: saveKey),
                     let snap = try? JSONDecoder().decode(Snapshot.self, from: data) {
                      conversations = snap.conversations
                      flags = Set(snap.flags)
                      finderName = snap.finderName
                  } else {
                      conversations = Story.initialConversations()
                  }
              }

              private func save() {
                  let snap = Snapshot(conversations: conversations, flags: Array(flags), finderName: finderName)
                  if let d = try? JSONEncoder().encode(snap) {
                      UserDefaults.standard.set(d, forKey: saveKey)
                  }
              }

              var sorted: [Conversation] {
                  conversations.sorted { $0.lastDate > $1.lastDate }
              }

              func idx(_ id: UUID) -> Int? { conversations.firstIndex { $0.id == id } }

              func markRead(_ id: UUID) {
                  guard let i = idx(id), conversations[i].unread else { return }
                  conversations[i].unread = false
              }

              func delete(_ id: UUID) {
                  conversations.removeAll { $0.id == id }
              }

              func reset() {
                  epoch += 1
                  UserDefaults.standard.removeObject(forKey: saveKey)
                  typing = []
                  banner = nil
                  openChat = nil
                  flags = []
                  finderName = nil
                  conversations = Story.initialConversations()
              }

              // MARK: timing

              static func typeTime(_ s: String) -> Double {
                  min(0.8 + Double(s.count) * 0.03, 3.0)
              }

              static func duration(_ parts: [String]) -> Double {
                  0.9 + parts.reduce(0.0) { $0 + typeTime($1) + 0.4 }
              }

              // MARK: sending and replying

              func send(_ text: String, to cid: UUID) {
                  guard let i = idx(cid) else { return }
                  conversations[i].messages.append(ChatMessage(text: text, isMe: true, date: Date(), fromFinder: true))
                  conversations[i].unread = false
                  guard conversations[i].live, let persona = Story.personas[conversations[i].key] else { return }
                  let c = conversations[i]
                  let res = Engine.respond(persona: persona, text: text, counts: c.counts, lastIntent: c.lastIntent,
                                           confused: c.confused, flags: flags, finderName: finderName)
                  if let n = res.detectedName { finderName = n }
                  if res.intentID == "epilogue" {
                      conversations[i].counts["epilogue", default: 0] += 1
                  } else if res.matched, let iid = res.intentID {
                      conversations[i].counts[iid, default: 0] += 1
                      conversations[i].lastIntent = iid
                      conversations[i].confused = 0
                  } else {
                      conversations[i].confused += 1
                      conversations[i].lastIntent = nil
                  }
                  flags.formUnion(res.sets)
                  var req: LLMRequest? = nil
                  if AIConfig.ready {
                      req = Director.request(persona: persona, convo: conversations[i], beat: res,
                                             flags: flags, finderName: finderName)
                  }
                  deliver(res.parts, to: cid, ai: req)
                  checkTriggers(offset: ChatStore.duration(res.parts) + (req == nil ? 0 : 3))
              }

              private func deliver(_ parts: [String], to cid: UUID, ai: LLMRequest? = nil) {
                  let ep = epoch
                  Task { @MainActor [weak self] in
                      guard let self = self else { return }
                      var parts = parts
                      try? await Task.sleep(nanoseconds: 900_000_000)
                      if let req = ai {
                          self.typing.insert(cid)
                          let text = await LLM.complete(req)
                          self.typing.remove(cid)
                          guard self.epoch == ep else { return }
                          if let text = text {
                              let p = Director.split(text)
                              if !p.isEmpty { parts = p }
                          }
                      }
                      for part in parts {
                          guard self.epoch == ep, self.idx(cid) != nil else { return }
                          self.typing.insert(cid)
                          try? await Task.sleep(nanoseconds: UInt64(ChatStore.typeTime(part) * 1_000_000_000))
                          guard self.epoch == ep else { return }
                          self.typing.remove(cid)
                          self.appendIncoming(part, to: cid)
                          try? await Task.sleep(nanoseconds: 400_000_000)
                      }
                  }
              }

              private func appendIncoming(_ text: String, to cid: UUID) {
                  guard let i = idx(cid) else { return }
                  conversations[i].messages.append(ChatMessage(text: text, isMe: false, date: Date()))
                  if openChat == cid { return }
                  conversations[i].unread = true
                  let b = Banner(convoID: cid, title: conversations[i].name, text: text)
                  banner = b
                  UIImpactFeedbackGenerator(style: .soft).impactOccurred()
                  Task { @MainActor [weak self] in
                      try? await Task.sleep(nanoseconds: 4_000_000_000)
                      if self?.banner == b { self?.banner = nil }
                  }
              }

              private func ensureConversation(_ key: String) -> UUID? {
                  if let c = conversations.first(where: { $0.key == key }) { return c.id }
                  guard let p = Story.personas[key] else { return nil }
                  let c = Conversation(key: p.key, name: p.name, emoji: p.emoji, c1: p.c1, c2: p.c2,
                                       pinned: false, unread: false, live: true, messages: [])
                  conversations.append(c)
                  return c.id
              }

              private func schedule(_ ping: Ping, extraDelay: Double) {
                  let ep = epoch
                  Task { @MainActor [weak self] in
                      guard let self = self else { return }
                      try? await Task.sleep(nanoseconds: UInt64((ping.delay + extraDelay) * 1_000_000_000))
                      guard self.epoch == ep, let cid = self.ensureConversation(ping.to) else { return }
                      let name = self.finderName ?? "stranger"
                      let raw = ping.text.replacingOccurrences(of: "{name}", with: name)
                      for part in raw.components(separatedBy: "||") {
                          guard self.epoch == ep, self.idx(cid) != nil else { return }
                          self.typing.insert(cid)
                          try? await Task.sleep(nanoseconds: UInt64(ChatStore.typeTime(part) * 1_000_000_000))
                          guard self.epoch == ep else { return }
                          self.typing.remove(cid)
                          self.appendIncoming(part, to: cid)
                          try? await Task.sleep(nanoseconds: 450_000_000)
                      }
                      if !ping.sets.isEmpty {
                          self.flags.formUnion(ping.sets)
                          self.checkTriggers(offset: 0)
                      }
                  }
              }

              func checkTriggers(offset: Double) {
                  for t in Story.triggers {
                      let fired = "fired_" + t.id
                      if flags.contains(fired) { continue }
                      if t.when.allSatisfy({ flags.contains($0) }) {
                          flags.insert(fired)
                          for p in t.pings { schedule(p, extraDelay: offset) }
                      }
                  }
              }
          }
