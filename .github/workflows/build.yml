                      Text("With Live AI on, every contact is a full AI character with their own personality and memory, and the story moves forward through your conversations. Get a free key at console.groq.com (recommended model: openai/gpt-oss-120b, or openai/gpt-oss-20b if you hit the daily limit). Your key stays on this phone. If a reply fails you'll see Not Delivered: tap it to try again. With Live AI off, a simpler built-in engine plays the characters offline.")
